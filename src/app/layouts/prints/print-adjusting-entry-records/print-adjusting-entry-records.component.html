<div class="hideOnPrint">
    <app-all-buttons (printClicked)="onClickPrint()" (excelClicked)="onClickExcel()"></app-all-buttons>
  </div>
   <div class="p text-center">
          <app-aprint-header></app-aprint-header>
        </div>
    <div class="title">
            {{Title}}
        </div>

  <table class="table table-bordered" #tableToExport >
      <thead class="thead-background">
        <tr>
          <th scope="col">TRANSDATE</th>
          <th scope="col">REFERENCE NO</th>
          <th scope="col">TRANSNAME</th>
          <th scope="col">INPUT DATETIME</th>
          <th scope="col">INPUT BY</th>
          <th scope="col">MACHINENAME</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let data of Headers">
          <td>{{data.TransDate | date:'MM/dd/yyyy'}}</td>
          <td>{{data.ReferenceNo}}</td>
          <td >{{data.TransName }}</td>
          <td >{{data.InputByDateTime | date:'MM/dd/yyyy h:mm a'}}</td>
          <td class="numeric">{{data.InputBy}}</td>
          <td >{{data.MachineName }}</td>
        </tr>
      </tbody>
    </table>

    <app-aprint-footer [totalRecords]="Headers.length"></app-aprint-footer>

<div class="hideOnPrint">
    <app-all-buttons (printClicked)="onClickPrint()" (excelClicked)="onClickExcel()"></app-all-buttons>
  </div>
   <div class="p text-center">
          <app-aprint-header></app-aprint-header>
        </div>
   <div class="title" *ngIf="Type4 == 'Title'">
            {{Title}}
        </div>
        <div class="title" *ngIf="Type4 == 'Title4'">
          {{Title4}}
      </div>

  <table class="table table-bordered" #tableToExport>
      <thead class="thead-background">
        <tr>
          <th scope="col">ITEMNAME</th>
          <th scope="col">UM</th>
          <th scope="col">CATEGORY</th>
          <th scope="col">EXPIRY DATE</th>
          <th scope="col">QTY</th>
          <th scope="col">COST</th>
          <th scope="col">AMOUNT</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let data of Data">
          <td>{{data.ItemName}}</td>
          <td>{{data.UM}}</td>
          <td>{{data.Category}}</td>
          <td>{{data.ExpiryDate | date:'MM/dd/yyyy'}}</td>
          <td class="numeric">{{data.Qty | number:'1.2-2'}}</td>
          <td class="numeric">{{data.Cost | number:'1.2-2'}}</td>
          <td class="numeric">{{data.Amount | number:'1.2-2'}}</td>
        </tr>
        <tr class="footer">
            <td class="no-border"[colSpan]="6"></td>
            <td class="numeric">{{getTotal('Amount') | number:'1.2-2' }}</td>
        </tr>
      </tbody>
    </table>
    <app-aprint-footer [totalRecords]="Data.length"></app-aprint-footer>

<div class="row g-0 mb-3" style="line-height: 1.3; text-align: center;">
    <div class="row col-12 col-md-12 g-0">
            <div *ngIf="hasPhoto">
                <img [src]="ordinaryPrinterLogo" alt="Logo">
            </div>
            <div>
                {{businessInfo.BusinessName}}  <br/>
                {{businessInfo.Address}}  <br/>
                {{businessInfo.ContactNo}} - {{businessInfo.ContactPerson}}<br/>
                {{businessInfo.VATType}} -  {{businessInfo.TIN}} <br/>
            </div>
    </div>
</div>

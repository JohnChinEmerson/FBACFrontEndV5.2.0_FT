<div class="hideOnPrint">
    <app-all-buttons (printClicked)="onClickPrint()" (excelClicked)="onClickExcel()"></app-all-buttons>
  </div>
   <div class="p text-center">
        <app-aprint-header></app-aprint-header>
    </div>
        <div class="title">
            {{Title}}
        </div>


    <div class="mb-5">
        <table  class="w-100 table table-bordered">
          <tr>
            <td class="w-18 ">TransNo </td>
            <td class="w-2"> : </td>
            <td class="w-30"  colspan="4">{{Data.TransNo  }}</td>
          </tr>
          <tr>
            <td class="w-18 ">TransDate </td>
            <td class="w-2"> : </td>
            <td class="w-30"  colspan="4">{{Data.TransDate  | date:'MM/dd/yyyy h:mm a'}}</td>
          </tr>
          <tr>
            <td class="w-18 ">Source</td>
            <td class="w-2"> : </td>
            <td class="w-30">{{Data.Source  }}</td>
            <td class="w-18 numeric">Source Type</td>
            <td class="w-2"> : </td>
            <td class="w-30">{{Data.SourceType}}</td>
          </tr>
          <tr>
            <td class="w-18 ">Amount</td>
            <td class="w-2"> : </td>
            <td class="w-30">{{Data.Amount | number:'1.2-2' }}</td>
            <td class="w-18 numeric"></td>
            <td class="w-2"> : </td>
            <td class="w-30"></td>
          </tr>
          <tr>
            <td class="w-18 ">Destination</td>
            <td class="w-2"> : </td>
            <td class="w-30">{{Data.Destination  }}</td>
            <td class="w-18 numeric">Destination Type</td>
            <td class="w-2"> : </td>
            <td class="w-30">{{Data.DestinationType}}</td>
          </tr>
      
        </table>
      </div>

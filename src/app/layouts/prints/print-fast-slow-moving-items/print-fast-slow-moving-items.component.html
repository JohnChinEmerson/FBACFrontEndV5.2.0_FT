
<div class="hideOnPrint">
    <app-all-buttons (printClicked)="onClickPrint()" (excelClicked)="onClickExcel()"></app-all-buttons>
  </div>
<div class="p text-center">
    <app-aprint-header></app-aprint-header>
</div>
<div class="title">
        {{Title}}
</div>

<div class="mb-5">
    <table class="table table-bordered" #tableToExport>
    <thead class="thead-background">  
      <tr>
        <th scope="col">ITEMNAME</th>
        <th scope="col">UM</th>
        <th scope="col">CATEGORY</th>
        <th scope="col">QTYIN</th>
        <th scope="col">QTYOUT</th>
        <th scope="col">SPEED %</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let data of Data">
        <td >{{data.ItemName }}</td>
        <td >{{data.UM }}</td>
        <td >{{data.Category }}</td>
        <td class="numeric">{{data.StockIn | number:'1.2-2'}}</td>
        <td class="numeric">{{data.StockOut | number:'1.2-2'}}</td>
        <td class="numeric">{{data.Speed | number:'1.2-2'}}</td>
      </tr>
    </tbody>  
  </table>
</div>

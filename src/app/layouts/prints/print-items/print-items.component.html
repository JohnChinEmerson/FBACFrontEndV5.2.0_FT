<div class="hideOnPrint">
    <app-all-buttons (printClicked)="onClickPrint()" (excelClicked)="onClickExcel()"></app-all-buttons>
  </div>
   <div class="p text-center">
          <app-aprint-header></app-aprint-header>
        </div>
    <div class="title">
            {{Title}}
        </div>

  <table class="table table-bordered" #tableToExport>
      <thead class="thead-background">
        <tr>
          <th scope="col">ItemName</th>
          <th scope="col">UM</th>
          <th scope="col">Category</th>
          <th scope="col">Cost</th>
          <th scope="col">Price</th>
          <th scope="col">Available</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let data of items">
          <td>{{data.ItemName}}</td>
          <td>{{data.UM}}</td>
          <td>{{data.Category}}</td>
          <td>{{data.Cost | number:'1.2-2'}}</td>
          <td>{{data.Price | number:'1.2-2'}}</td>
          <td>{{data.Available | number:'1.2-2'}}</td>
        </tr>
      </tbody>
    </table>
    <app-aprint-footer [totalRecords]="items.length"></app-aprint-footer>

<div class="hideOnPrint">
    <app-all-buttons (printClicked)="onClickPrint()" (excelClicked)="onClickExcel()"></app-all-buttons>
  </div>
  <div class="p text-center">
    <app-aprint-header></app-aprint-header>
  </div>
  <div class="title">
    <h3>{{Title}}</h3>
  </div>
  <table class="table table-bordered" #tableToExport *ngIf="Type == 'per branch'">
    <thead class="thead-background">
        <tr>
            <th scope="col">ItemName</th>
            <th scope="col">Available</th>
            <th scope="col">Cost</th>
            <th scope="col">Price</th>
        </tr>
    </thead>
    <tbody>
        <tr *ngFor="let data of Data">
            <td>{{data.ItemName}}</td>
            <td class="numeric">{{data.Available | number:'1.2-2'}}</td>
            <td class="numeric">{{data.Cost | number:'1.2-2'}}</td>
            <td class="numeric">{{data.Price | number:'1.2-2'}}</td>
        </tr>
    </tbody>
  </table>
  <div *ngIf="Type == 'all'">
    <table class="table table-bordered" #tableToExport>
        <thead class="thead-background">
            <tr>
                <th scope="col">ItemName</th>
                <th scope="col" *ngFor="let branch of Branches">{{branch.BranchName}}</th>
                <th scope="col">Total</th>
            </tr>
        </thead>
        <tbody>
            <tr *ngFor="let data of Data">
                <td>{{data.ItemName}}</td>
                <td class="numeric" *ngFor="let branch of Branches">{{data[branch.BranchName]  | number:'1.2-2'}}</td>
                <td class="numeric">{{getTotal(data) | number:'1.2-2'}}</td>
            </tr>
        </tbody>
    </table>
  </div>

<div class="hideOnPrint">
    <app-all-buttons (printClicked)="onClickPrint()" (excelClicked)="onClickExcel()"></app-all-buttons>
  </div>
   <div class="p text-center">
          <app-aprint-header></app-aprint-header>
        </div>
    <div class="title">
            {{Title}}
        </div>

  <table class="table table-bordered" #tableToExport>
      <thead class="thead-background">
        <tr>
          <th scope="col">CustomerName</th>
          <th scope="col">Address</th>
          <th scope="col">ContactNo</th>
          <th scope="col">TermDays</th>
          <th scope="col">CustomerTIN</th>  
          <th scope="col">BusinessStyle</th>
          <th scope="col">PriceCategory</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let data of customers">
          <td>{{data.CustomerName}}</td>
          <td>{{data.Address}}</td>
          <td>{{data.ContactNo}}</td>
          <td>{{data.TermDays}}</td>
          <td>{{data.CustomerTIN}}</td>
          <td>{{data.BusinessStyle}}</td>
          <td>{{data.PriceCategory}}</td>
        </tr>
      </tbody>
    </table>
    <app-aprint-footer [totalRecords]="customers.length"></app-aprint-footer>

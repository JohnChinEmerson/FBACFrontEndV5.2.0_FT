<div class="hideOnPrint">
    <app-all-buttons (printClicked)="onClickPrint()" (excelClicked)="onClickExcel()"></app-all-buttons>
  </div>
   <div class="p text-center">
          <app-aprint-header></app-aprint-header>
        </div>
    <div class="title">
            {{Title}}
        </div>

  <table class="table table-bordered" #tableToExport>
      <thead class="thead-background">
        <tr>
          <th scope="col">ACCOUNT CODE</th>
          <th scope="col">ACCOUNT TITLE</th>
          <th scope="col">ACCOUNT TYPE</th>
          <th scope="col">NORMAL COLUMN</th>
          <th scope="col">IS BUILTIN</th>  
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let data of data">
          <td>{{data.AccountCode}}</td>
          <td>{{data.AccountTitle}}</td>
          <td>{{data.AccountType}}</td>
          <td>{{data.NormalColumn}}</td>
          <td>{{data.IsBuiltIn}}</td>
        </tr>
      </tbody>
    </table>
    <app-aprint-footer [totalRecords]="data.length"></app-aprint-footer>

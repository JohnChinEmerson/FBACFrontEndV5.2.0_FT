<section class="content">
    <div class="search-div">
       <ng-select
            [items]="checkStatus" 
            bindLabel="label"
            bindValue="value"
            [virtualScroll]="true" 
            appendTo="body" 
            [(ngModel)]="status" 
            [searchable]="true" 
            [clearable]="false" 
            placeholder="Status"
            class="w-10"
            (change)="emptyTable()">
        </ng-select>
            <ng-select 
                [items]="months" 
                [virtualScroll]="true" 
                bindLabel="Label"
                bindValue="Value"
                appendTo="body" 
                [(ngModel)]="month" 
                [searchable]="true" 
                [clearable] = "false" 
                placeholder="Month"
                class="w-10"
                >
            </ng-select>
            <ng-select 
                [items]="years" 
                [virtualScroll]="true" 
                appendTo="body" 
                [(ngModel)]="year" 
                [searchable]="true" 
                [clearable] = "false" 
                placeholder="Year"
                class="w-10"
                >
            </ng-select>
            <button mat-raised-button color="primary" *ngFor="let tB of toolButtons" [disabled]="!tB.Disabled || (status.toLowerCase() == 'unreleased' && tB.Label.toLowerCase() == 'release / unrelease')" (click)="tB.Function()" >{{tB.Label}}</button> 
            <mat-icon>more_vert</mat-icon>
            <mat-form-field class="w-20" floatLabel="never"  appearance="standard">
                <input matInput [(ngModel)]="searchKey" placeholder="Search" (keyup)="applyFilter()" autocomplete="false">
                <button mat-button matSuffix mat-icon-button aria-label="Clear" (click)="clearSearch()">
                <mat-icon>close</mat-icon>
                </button>
            </mat-form-field>
    </div>
    <div class="mat-elevation-z2 w-100">
        <div class="mat-elevation-z2">
            <mat-table [dataSource]="listData" matSort>
                
                 <ng-container *ngFor="let dc of defaultColumns2">
                    <ng-container [matColumnDef]="dc">
                    <mat-header-cell *matHeaderCellDef sticky>{{ dc }}</mat-header-cell>
                    <mat-cell *matCellDef="let element"
                                class="auto-adjust-cell"
                                [ngClass]="element | rowClasses:dc:columnTypeMap2[dc]"
                                [title]="element[dc]">
                        <ng-container [ngSwitch]="dc">
                        <span *ngSwitchCase="'actions'">
                                <mat-checkbox (change)="onCheckToDeposit(element, $event.checked)" [checked]="existInSupplierChecksToDeposit(element)"></mat-checkbox>
                        </span>
                        <span *ngSwitchDefault>
                            {{ element | rowDisplay:dc:columnTypeMap2[dc] }}
                        </span>
                        </ng-container>
                    </mat-cell>
                     <mat-footer-cell *matFooterCellDef class="footer" [ngClass]="columnTypeMap[dc]">
                            <ng-container [ngSwitch]="columnTypeMap[dc]">
                                <span *ngSwitchCase="'decimal'">{{ listData | columnTotal:dc | number:'1.2-2' }}</span>
                                <span *ngSwitchCase="'int'">{{ listData | columnTotal:dc | number:'1.0-0' }}</span>
                                <span *ngSwitchDefault></span>
                            </ng-container>
                        </mat-footer-cell>

                    </ng-container>
                </ng-container>
             
                <ng-container matColumnDef="loading">
                    <mat-footer-cell *matFooterCellDef colspan="6">
                        <mat-progress-bar color="primary" mode="indeterminate"></mat-progress-bar>
                    </mat-footer-cell>
                </ng-container>
                <ng-container matColumnDef="noData">
                    <mat-footer-cell *matFooterCellDef colspan="6">
                        No data.
                    </mat-footer-cell>
                </ng-container>
                <mat-header-row *matHeaderRowDef="getDisplayColumns(); sticky:true"></mat-header-row>
                <mat-row (click)="getRecord(row)" *matRowDef="let row; columns: getDisplayColumns();" [ngClass]="{'data-selected': selectedId == row.SupplierCheckId+'-'+row.CheckNo}" appTouchContextMenu (contextmenu)="onContextMenu($event, row)"></mat-row>
                <mat-footer-row *matFooterRowDef="['loading']" [ngClass]="{'hide':!isLoading}"></mat-footer-row>
                <mat-footer-row *matFooterRowDef="['noData']" [ngClass]="{'hide':!(listData!=null && listData.data.length==0)}"></mat-footer-row>
                <mat-footer-row [ngClass]="{'hide':(listData!=null && listData.data.length==0)}" *matFooterRowDef="getDisplayColumns();"></mat-footer-row>
            </mat-table>

          <mat-paginator class="mat-paginator-sticky" [pageSize]="20" [pageSizeOptions]="pageSizeOptions" showFirstLastButtons> </mat-paginator>
        </div>
    </div>
</section>
<div style="visibility: hidden; position: fixed"
    [style.left]="contextMenuPosition.x"
    [style.top]="contextMenuPosition.y"
    [matMenuTriggerFor]="contextMenu">
</div>
<mat-menu #contextMenu="matMenu">
	<ng-template matMenuContent let-data="data">
        <button mat-menu-item *ngFor="let cB of contextButtons" [disabled]="!cB.Disabled" (click)="cB.Function()" >
            <mat-icon>read_more</mat-icon> {{cB.Label}}
        </button>
    </ng-template>
</mat-menu>

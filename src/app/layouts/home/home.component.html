<mat-toolbar *ngIf="showLayout" class="nav-toolbar" style="height:50px !important" color="basic">
    <nav class="navbar navbar-expand">
        <div class="container-fluid">
            <button
                class="toggleButton"
                type="button"
                aria-label="Toggle sidenav"
                mat-icon-button
                (click)="drawer.toggle()">
                <mat-icon aria-label="Side nav toggle icon">menu</mat-icon>
            </button>

            <ul class="navbar-nav navMenus" #navMenuContainer>
                <li *ngFor="let Menu of Menus; let i = index" 
                    class="nav-item" 
                    #navItem
                    [class.nav-item-hidden]="hiddenMenuIndexes.includes(i)">
                    <a
                        [ngClass]="{'active-link': getPath(Menu.MenuName.toLowerCase()) == true}"
                        class="nav-link dropdown-toggle"
                        type="button"
                        [matMenuTriggerFor]="menu"
                        id="navbarDropdownMenuLink">
                        {{Menu.MenuName}}
                    </a>
                    <mat-menu #menu="matMenu">
                        <div *ngFor="let SubMenu of SubMenus">
                            <button
                                (click)="onSelectSubMenu(SubMenu.id)"
                                *ngIf="Menu.id == SubMenu.MenuId"
                                routerLinkActive="active-submenu"
                                [routerLinkActiveOptions]="{ exact: true }"
                                routerLink="{{SubMenu.RouteName.toLowerCase()}}"
                                mat-menu-item>
                                {{SubMenu.SubMenuName}}
                            </button>
                        </div>
                    </mat-menu>
                </li>

                <!-- More dropdown for overflow items -->
                <li class="nav-item" *ngIf="hiddenMenuIndexes.length > 0">
                    <a class="nav-link more-link"
                        type="button"
                        [matMenuTriggerFor]="moreMenu">
                        More <mat-icon style="font-size:16px;vertical-align:middle;height:16px;width:16px;">expand_more</mat-icon>
                    </a>
                    <mat-menu #moreMenu="matMenu">
                        <ng-container *ngFor="let Menu of Menus; let i = index">
                            <ng-container *ngIf="hiddenMenuIndexes.includes(i)">
                                <button mat-menu-item [matMenuTriggerFor]="subMoreMenu">
                                    {{Menu.MenuName}}
                                </button>
                                <mat-menu #subMoreMenu="matMenu">
                                    <div *ngFor="let SubMenu of SubMenus">
                                        <button
                                            (click)="onSelectSubMenu(SubMenu.id)"
                                            *ngIf="Menu.id == SubMenu.MenuId"
                                            routerLink="{{SubMenu.RouteName.toLowerCase()}}"
                                            mat-menu-item>
                                            {{SubMenu.SubMenuName}}
                                        </button>
                                    </div>
                                </mat-menu>
                            </ng-container>
                        </ng-container>
                    </mat-menu>
                </li>
            </ul>

            <ul class="navbar-nav ms-auto">
                <li class="nav-item">
                    <button mat-icon-button [matMenuTriggerFor]="menu2">
                        <mat-icon class="acct-icon">account_circle</mat-icon>
                    </button>
                    <mat-menu #menu2="matMenu">
                        <button mat-menu-item routerLink="/home/profile">
                            {{auth_service.UserAccount.UserFullName}}
                        </button>
                        <button mat-menu-item (click)="logout()">Logout</button>
                    </mat-menu>
                </li>
            </ul>
        </div>
    </nav>
</mat-toolbar>
 <mat-toolbar *ngIf="showLayout"  class="business-cont mat-elevation-z3"  style="height:50px !important">
        <span class="business-name" *ngIf="Branch"  routerLink="/home">{{BusinessName}} - {{Branch.BranchName}}</span>
        <span class="business-name" *ngIf="!Branch"  routerLink="/home">{{BusinessName}}</span>
        <button mat-icon-button [matMenuTriggerFor]="menu3" *ngIf="auth_service.AccessRight == 'commonadmin'" title="Branches">
            <mat-icon class="acct-icon">home</mat-icon>
        </button>
        <mat-menu #menu3="matMenu">
            <button mat-menu-item *ngFor="let data of Branches" (click)="onClickSelectBranch(data)">{{data.BranchName}} </button>
        </mat-menu>
    </mat-toolbar>

    
    <mat-sidenav-container >
        <mat-sidenav #drawer [hidden]="!showLayout">
            <mat-toolbar>Menu</mat-toolbar>
            <mat-divider></mat-divider>
            <mat-nav-list *ngFor="let Menu of Menus">
                <a mat-list-item [matMenuTriggerFor]="menu" [ngClass]="{'active-link': getPath(Menu.MenuName.toLowerCase()) == true}">{{Menu.MenuName}}</a>
                <mat-menu #menu="matMenu">
                    <div *ngFor="let SubMenu of SubMenus">
                        <!-- same as the top menu: the screen loads the buttons of this submenu; phones close the side menu -->
                        <button *ngIf="Menu.id == SubMenu.MenuId"
                            (click)="onSelectSubMenu(SubMenu.id); closeNavOnPhone()"
                            routerLinkActive="active-submenu"
                            [routerLinkActiveOptions]="{ exact: true }"
                            routerLink="{{SubMenu.RouteName.toLowerCase()}}"
                            mat-menu-item
                            >
                            {{SubMenu.SubMenuName}}
                        </button>
                    </div>
                </mat-menu>
            </mat-nav-list>
            <mat-nav-list >
                <button mat-icon-button [matMenuTriggerFor]="menu2">
                    <mat-icon class="acct-icon">account_circle</mat-icon>
                  </button>
                  <mat-menu #menu2="matMenu" >
                    <button mat-menu-item routerLink="profile">Profile</button>
                    <button mat-menu-item (click)="logout()" >Logout</button>
                  </mat-menu>
            </mat-nav-list>
            <!-- phones: the footer belongs to the side menu (nothing fixed over the screen) -->
            <app-footer class="sidenav-footer" [inSidenav]="true" *ngIf="showLayout"></app-footer>
        </mat-sidenav>
        <mat-sidenav-content class="content">
            <div *ngIf="this.router.url == '/home' && showLayout">
                <!-- <app-background-logo-ui *ngIf="auth_service.UserAccount.ShowDashboard == 'no'"></app-background-logo-ui>
                <app-dashboard *ngIf="auth_service.UserAccount.ShowDashboard == 'yes'"></app-dashboard> -->
                <app-background-logo-ui *ngIf="!isShowDashboard"></app-background-logo-ui>
                <app-dashboard *ngIf="isShowDashboard"></app-dashboard>
            </div>
            
            <router-outlet></router-outlet>
            <app-footer class="content-footer" *ngIf="showLayout"></app-footer>
        </mat-sidenav-content>

    </mat-sidenav-container>
<!-- Sales Config On Screen Keyboard (turned on by the sales screens) -->
<app-on-screen-keyboard></app-on-screen-keyboard>

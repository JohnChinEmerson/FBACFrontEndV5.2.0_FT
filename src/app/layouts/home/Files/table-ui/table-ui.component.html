<button mat-icon-button class="close-button" (click)="onClose()">
    <mat-icon class="close-icon" color="warn">close</mat-icon>
</button>
<h2 mat-dialog-title>TableUI</h2>
<mat-divider></mat-divider>
<form [formGroup]="tableForm" (ngSubmit)="onSubmit()" *ngIf="tableForm">
    <div mat-dialog-content>
        <div class="row" *ngIf="multipleTable">
            <div class="col align-elements">
                <ng-select
                    [items]="tableCategorys"
                    appendTo="body"
                    formControlName="TableCategory"
                    bindLabel="TableCategory"
                    bindValue="TableCategory"
                    [searchable]="true"
                    [clearable]="false"
                    placeholder="TableCategory"
                    required>
                </ng-select>
            </div>
        </div>
        <mat-form-field appearance="standard" *ngIf="!multipleTable">
            <mat-label>TableCategory</mat-label>
            <input matInput formControlName="TableCategory">
            <mat-hint>Files Config MultipleTable is set to no.</mat-hint>
        </mat-form-field>
        <mat-form-field appearance="standard">
            <mat-label>TableSuffix</mat-label>
            <input matInput placeholder="e.g. TABLE" autocomplete="off" required formControlName="TableSuffix">
        </mat-form-field>
        <div class="row">
            <div class="col-6">
                <mat-form-field appearance="standard">
                    <mat-label>StartCount</mat-label>
                    <input matInput type="number" min="0" autocomplete="off" required formControlName="StartCount">
                </mat-form-field>
            </div>
            <div class="col-6">
                <mat-form-field appearance="standard">
                    <mat-label>No. of Tables</mat-label>
                    <input matInput type="number" min="1" max="500" autocomplete="off" required formControlName="NoOfTables">
                </mat-form-field>
            </div>
        </div>
        <div class="preview" *ngIf="previewNames">Will create: <b>{{ previewNames }}</b></div>
    </div>
    <div mat-dialog-actions align="end">
        <button mat-raised-button color="primary" type="submit" [disabled]="isSaving">Save</button>
    </div>
</form>

<button mat-icon-button class="close-button" (click)="onClose()">
    <mat-icon class="close-icon" color="warn">close</mat-icon>
</button>
<h2 mat-dialog-title>SupplierUI</h2>
<mat-divider></mat-divider>
<form [formGroup]="supplierForm" (ngSubmit)="onSubmit()">
    <div mat-dialog-content>
        <mat-form-field class="" appearance="standard">
            <mat-label>SupplierName</mat-label>
            <input matInput placeholder="Input SupplierName" autocomplete="off" required formControlName="SupplierName">
        </mat-form-field>
        <div class="row">
            <div class="col-6">
                <mat-form-field class="w-100"  appearance="standard">
                    <mat-label>ContactPerson</mat-label>
                    <input matInput placeholder="Input ContactPerson" autocomplete="off" required formControlName="ContactPerson">
                </mat-form-field>
            </div>
            <div class="col-6">
                <mat-form-field class="w-100"  appearance="standard">
                    <mat-label>ContactNo</mat-label>
                    <input matInput placeholder="Input ContactNo" autocomplete="off" required formControlName="ContactNo">
                </mat-form-field>
            </div>
        </div>
        <div class="row">
                <mat-form-field class="w-100"  appearance="standard">
                    <mat-label>Address</mat-label>
                    <input matInput placeholder="Input Address" autocomplete="off" required formControlName="Address">
                </mat-form-field>
        </div>
        <div class="row">
            <div class="col-6">
                <mat-form-field class="w-100" appearance="standard">
                    <mat-label>SupplierTIN</mat-label>
                    <input matInput placeholder="Input SupplierTIN" autocomplete="off" required formControlName="SupplierTIN">
                </mat-form-field>
            </div>
            <div class="col-6">
                <mat-form-field class="" appearance="standard">
                    <mat-label>TermDays</mat-label>
                    <input matInput placeholder="Input TermDays" type="text" mask="separator.2" thousandSeparator="," decimalMarker="." [dropSpecialCharacters]="true" [allowNegativeNumbers]="true" autocomplete="off" required formControlName="TermDays">
                </mat-form-field>
            </div>
        </div>
        <div class="row">
            <div class="col align-elements">
                <ng-select  
                    class="w-15" 
                    [items]="businessStyles" 
                    [virtualScroll]="true" 
                    appendTo="body" 
                    formControlName="BusinessStyle" 
                    bindLabel="BusinessStyle" 
                    bindValue="BusinessStyle"  
                    [searchable]="true" 
                    [clearable] = "false" 
                    placeholder="BusinessStyle" 
                    required>
                </ng-select>
                <button type="button"  (click)="onClickBusinessStyle()"mat-icon-button color="primary"> <mat-icon>list</mat-icon></button>
            </div>
        </div>
    </div>
    <div mat-dialog-actions [align]="'end'" class="mb-3">
        <button type="submit" class="mt-4 me-2" mat-raised-button color="primary" [disabled]="supplierForm.invalid || loading == true">{{btnText}}</button>
    </div>
  </form>

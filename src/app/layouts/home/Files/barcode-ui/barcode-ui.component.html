<button mat-icon-button class="close-button" [mat-dialog-close]="true">
    <mat-icon class="close-icon" color="warn">close</mat-icon>
</button>
<h2 mat-dialog-title>BarcodeUI</h2>
<mat-divider></mat-divider>
<form [formGroup]="otherForm" (ngSubmit)="onSubmit()" enctype="multipart/form-data">
    <div mat-dialog-content>
        <div class="row">
            <mat-form-field class="w-100" appearance="standard">
              <mat-label>ItemName</mat-label>
              <input matInput placeholder="ItemName" autocomplete="off" formControlName="ItemName" readonly>
            </mat-form-field>
          </div>
           <div class="row">
            <mat-form-field class="w-100" appearance="standard">
              <mat-label>UM</mat-label>
              <input matInput placeholder="UM" autocomplete="off" formControlName="UM" readonly>
            </mat-form-field>
          </div>
          
        <div class="row">
          <mat-form-field class="w-100" appearance="standard">
            <mat-label>Barcode</mat-label>
            <input matInput placeholder="Scan Barcode" autocomplete="off" formControlName="Barcode">
          </mat-form-field>
        </div>
    
        <div mat-dialog-actions [align]="'end'" class="mb-3">
         <button type="button"    mat-button color="primary" class="me-7" *ngIf="showUpdateBranchBarcodeOption">
              <mat-checkbox  [checked]="updateBranchBarcode"  (change)="onChangeUpdateBranchBarcode($event.checked)" >
                  <mat-label>Update Branch Barcode</mat-label>
              </mat-checkbox>
          </button>
        <button type="submit" class="mt-5 me-2" mat-raised-button color="primary" [disabled]="otherForm.invalid || loading == true">{{btnText}}</button>
      </div>
    </div>
  </form>

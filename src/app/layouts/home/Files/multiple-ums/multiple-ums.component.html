<button mat-icon-button class="close-button" (click)="onClose()">
    <mat-icon class="close-icon" color="warn">close</mat-icon>
</button>
<h2 mat-dialog-title>MultipleUMs - {{item?.ItemName}} | Available :{{item?.Available | number:'1.2-2'}}</h2>
<mat-divider></mat-divider>
<div class="search-div">
     <mat-form-field  floatLabel="never"  appearance="standard">
            <input matInput [(ngModel)]="searchKey" placeholder="Search" (keyup)="applyFilter()" autocomplete="false">
            <button mat-button matSuffix mat-icon-button aria-label="Clear" (click)="clearSearch()">
            <mat-icon>close</mat-icon>
            </button>
    </mat-form-field>
    <button mat-raised-button color="primary" *ngFor="let tB of toolButtons" [disabled]="!tB.Disabled" (click)="tB.Function()" >{{tB.Label}}</button> 
    <button mat-raised-button color="primary" *ngFor="let tB of toolButtons2" [disabled]="!tB.Disabled" (click)="tB.Function()">{{tB.Label}}</button> 
</div>
  <div class="mat-elevation-z2 w-100">
    <mat-table [dataSource]="listData" matSort *ngIf="type.toLowerCase() == 'items'">
        <ng-container *ngFor="let dc of defaultColumns">
            <ng-container  [matColumnDef]="dc">
            <mat-header-cell *matHeaderCellDef sticky>{{ dc }}</mat-header-cell>
                <mat-cell  *matCellDef="let element"  class="auto-adjust-cell" [ngClass]="element | rowClasses:dc:columnTypeMap[dc]" [title]="element[dc]">
                <span>{{ element | rowDisplay:dc:columnTypeMap[dc] }}</span>
                </mat-cell>
            </ng-container>
        </ng-container>
        <ng-container matColumnDef="loading">
            <mat-footer-cell *matFooterCellDef colspan="6">
                <mat-progress-bar color="primary" mode="indeterminate"></mat-progress-bar>
            </mat-footer-cell>
        </ng-container>
        <ng-container matColumnDef="noData">
            <mat-footer-cell *matFooterCellDef colspan="6">
                No data.
            </mat-footer-cell>
        </ng-container>
        <mat-header-row *matHeaderRowDef="defaultColumns; sticky:true"></mat-header-row>
        <mat-row  (click)="getRecord(row)" *matRowDef="let row; columns: defaultColumns;" [ngClass]="{'data-selected': selectedId == row.ConversionId}" appTouchContextMenu (contextmenu)="onContextMenu($event, row)"></mat-row>
        <mat-footer-row *matFooterRowDef="['loading']" [ngClass]="{'hide':!isLoading}"></mat-footer-row>
        <mat-footer-row *matFooterRowDef="['noData']"  [ngClass]="{'hide':!(listData!=null && listData.data.length==0)}"></mat-footer-row>
    </mat-table>

    <mat-table [dataSource]="listData" matSort *ngIf="type.toLowerCase() == 'inventory'">
        <ng-container *ngFor="let dc of defaultColumns2">
                <ng-container  [matColumnDef]="dc">
                <mat-header-cell *matHeaderCellDef sticky>{{ dc }}</mat-header-cell>
                    <mat-cell  *matCellDef="let element"  class="auto-adjust-cell" [ngClass]="element | rowClasses:dc:columnTypeMap2[dc]" [title]="element[dc]">
                    <span>{{ element | rowDisplay:dc:columnTypeMap2[dc] }}</span>
                    </mat-cell>
                </ng-container>
            </ng-container>
        <ng-container matColumnDef="loading">
            <mat-footer-cell *matFooterCellDef colspan="6">
                <mat-progress-bar color="primary" mode="indeterminate"></mat-progress-bar>
            </mat-footer-cell>
        </ng-container>
        <ng-container matColumnDef="noData">
            <mat-footer-cell *matFooterCellDef colspan="6">
                No data.
            </mat-footer-cell>
        </ng-container>
        <mat-header-row *matHeaderRowDef="defaultColumns2; sticky:true"></mat-header-row>
        <mat-row  (click)="getRecord(row)" (dblclick)="saveToTransaction(row)" *matRowDef="let row; columns: defaultColumns2;" [ngClass]="{'data-selected': selectedId == row.ConversionId}" appTouchContextMenu (contextmenu)="onContextMenu($event, row)"></mat-row>
        <mat-footer-row *matFooterRowDef="['loading']" [ngClass]="{'hide':!isLoading}"></mat-footer-row>
        <mat-footer-row *matFooterRowDef="['noData']"  [ngClass]="{'hide':!(listData!=null && listData.data.length==0)}"></mat-footer-row>
    </mat-table>

    <mat-table [dataSource]="listData" matSort *ngIf="type.toLowerCase() == 'inventorystocks'">
       <ng-container *ngFor="let dc of defaultColumns3">
            <ng-container  [matColumnDef]="dc">
                <mat-header-cell *matHeaderCellDef sticky>{{ dc }}</mat-header-cell>
                <mat-cell  *matCellDef="let element"  class="auto-adjust-cell" [ngClass]="element | rowClasses:dc:columnTypeMap3[dc]" [title]="element[dc]">
                    <ng-container [ngSwitch]="dc">
                    <span *ngSwitchCase="'PhysicalCount'">
                    <input matInput class="clickable inputtable" title="Input PhysicalCount " type="text"    [value]="element.PhysicalCount" autocomplete="false" (keyup.enter)="onEnterPhysicalCount(element,element.ItemId, $event)" (focusout)="onEnterPhysicalCount(element, element.ItemId, $event)">
                    </span>
                    <span *ngSwitchDefault>
                        {{ element | rowDisplay:dc:columnTypeMap3[dc] }}
                    </span>
                </ng-container>
                </mat-cell>
            </ng-container>
        </ng-container>
        <!-- <ng-container *ngFor="let dc of defaultColumns3" [matColumnDef]="dc">
            <mat-header-cell *matHeaderCellDef mat-sort-header>{{dc}}</mat-header-cell>
            <mat-cell *matCellDef="let element">{{element[dc]}}</mat-cell>
        </ng-container>
        <ng-container *ngFor="let dc of numberColumns3" [matColumnDef]="dc">
            <mat-header-cell *matHeaderCellDef mat-sort-header>{{dc}}</mat-header-cell>
            <mat-cell *matCellDef="let element">
                 <ng-container *ngIf="dc == 'PhysicalCount'; else displayValue">
                            <input matInput class="clickable inputtable" title="Input PhysicalCount " type="text"    [value]="element.PhysicalCount" autocomplete="false" (keyup.enter)="onEnterPhysicalCount(element,element.ItemId, $event)" (focusout)="onEnterPhysicalCount(element, element.ItemId, $event)">
                        </ng-container>
                        <ng-template #displayValue>
                            {{ element[dc] | number:'1.2-2'}}
                        </ng-template>

            </mat-cell>
        </ng-container> -->

        <ng-container matColumnDef="loading">
            <mat-footer-cell *matFooterCellDef colspan="6">
                <mat-progress-bar color="primary" mode="indeterminate"></mat-progress-bar>
            </mat-footer-cell>
        </ng-container>
        <ng-container matColumnDef="noData">
            <mat-footer-cell *matFooterCellDef colspan="6">
                No data.
            </mat-footer-cell>
        </ng-container>
        <mat-header-row *matHeaderRowDef="defaultColumns3; sticky:true"></mat-header-row>
        <mat-row  (click)="getRecord(row)" *matRowDef="let row; columns: defaultColumns3;" [ngClass]="{'data-selected': selectedId == row.ConversionId}" appTouchContextMenu (contextmenu)="onContextMenu($event, row)"></mat-row>
        <mat-footer-row *matFooterRowDef="['loading']" [ngClass]="{'hide':!isLoading}"></mat-footer-row>
        <mat-footer-row *matFooterRowDef="['noData']"  [ngClass]="{'hide':!(listData!=null && listData.data.length==0)}"></mat-footer-row>
    </mat-table>


  <mat-paginator class="mat-paginator-sticky" [pageSize]="5" [pageSizeOptions]="pageSizeOptions" showFirstLastButtons> </mat-paginator>
</div>

<!-- RightClickEvent -->
    <div style="visibility: hidden; position: fixed" [style.left]="contextMenuPosition.x" [style.top]="contextMenuPosition.y" [matMenuTriggerFor]="contextMenu"></div>
    <mat-menu #contextMenu="matMenu">
    <ng-template matMenuContent let-data="data">
        <button mat-menu-item *ngFor="let cB of contextButtons" [disabled]="!cB.Disabled" (click)="cB.Function()">
        <mat-icon>read_more</mat-icon> {{cB.Label}}
        </button>
    </ng-template>
    </mat-menu>
<!-- End RightClickEvent -->

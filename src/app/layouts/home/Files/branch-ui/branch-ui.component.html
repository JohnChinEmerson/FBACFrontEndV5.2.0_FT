<button mat-icon-button class="close-button" (click)="onClose()">
    <mat-icon class="close-icon" color="warn">close</mat-icon>
</button>
<h2 mat-dialog-title>BranchUI</h2>
<mat-divider></mat-divider>
<form [formGroup]="branchForm" (ngSubmit)="onSubmit()">
    <div mat-dialog-content>
        <div class="row">
            <mat-form-field class="" appearance="standard">
                <mat-label>BranchName</mat-label>
                <input matInput placeholder="Input BranchName" autocomplete="off" required formControlName="BranchName">
            </mat-form-field>
        </div>
    </div>
    <div mat-dialog-actions [align]="'end'" class="mb-3">
        <button type="submit" class="mt-4 me-2" mat-raised-button color="primary" [disabled]="branchForm.invalid || loading == true">{{btnText}}</button>
    </div>
  </form>

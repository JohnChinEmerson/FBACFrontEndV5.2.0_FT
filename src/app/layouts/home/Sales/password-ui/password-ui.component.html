<button mat-icon-button class="close-button" (click)="onClose()">
<mat-icon class="close-icon" color="warn">close</mat-icon>
</button>
<h2 mat-dialog-title>PasswordUI</h2>
<mat-divider></mat-divider>
<form [formGroup]="passwordFormUI" (ngSubmit)="onSubmit()">
    <div mat-dialog-content>
      <mat-form-field  appearance="standard">
            <input  matInput placeholder="Input Password" autocomplete="off" type="password" formControlName="PasswordEditRemovePending">
        </mat-form-field>
    </div>
</form>

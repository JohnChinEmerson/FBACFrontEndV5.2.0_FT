<app-background-logo-ui></app-background-logo-ui>

<div class="content">
    <mat-card>
        <button mat-icon-button class="close-button" (click)="onClose()" aria-label="Close dialog">
            <mat-icon class="close-icon" color="warn">close</mat-icon>
        </button>

        <h2 mat-dialog-title>ReceivingConfigUI</h2>
        <mat-divider></mat-divider>

        <form [formGroup]="receivingConfigForm" (ngSubmit)="onSubmit()">

            <div mat-dialog-content>
                <div class="config-grid">

                    <div class="field-row">
                        <mat-checkbox
                            [checked]="receivingConfig.AutoAdjustPriceCostUp == 'yes'"
                            (change)="onCheck('AutoAdjustPriceCostUp', $event.checked, receivingConfig.AutoAdjustPriceCostUp, 'Boolean')">
                            Auto Adjust Price Cost Up
                        </mat-checkbox>

                        <mat-form-field appearance="outline" class="dense-field">
                            <input
                                matInput
                                placeholder="Input AutoAdjustPriceCostUp"
                                autocomplete="off"
                                formControlName="AutoAdjustPriceCostUp">
                        </mat-form-field>
                    </div>

                    <div class="field-row">
                        <mat-checkbox
                            [checked]="receivingConfig.AutoAdjustPriceCostDown == 'yes'"
                            (change)="onCheck('AutoAdjustPriceCostDown', $event.checked, receivingConfig.AutoAdjustPriceCostDown, 'Boolean')">
                            Auto Adjust Price Cost Down
                        </mat-checkbox>

                        <mat-form-field appearance="outline" class="dense-field">
                            <input
                                matInput
                                placeholder="Input AutoAdjustPriceCostDown"
                                autocomplete="off"
                                formControlName="AutoAdjustPriceCostDown">
                        </mat-form-field>
                    </div>

                    <div class="field-row2">
                        <mat-checkbox
                            [checked]="receivingConfig.AutoVoucher == 'yes'"
                            [disabled]="true"
                            (change)="onCheck('AutoVoucher', $event.checked, receivingConfig.AutoVoucher, 'Boolean')">
                            Auto Voucher
                        </mat-checkbox>

                        <mat-form-field appearance="outline" class="dense-field">
                            <input
                                matInput
                                placeholder="Input AutoVoucher"
                                autocomplete="off"
                                formControlName="AutoVoucher"
                                [disabled]="true">
                        </mat-form-field>

                         <mat-checkbox
                            [checked]="receivingConfig.AutoDisburse == 'yes'"
                            (change)="onCheck('AutoDisburse', $event.checked, receivingConfig.AutoDisburse, 'Boolean')">
                            Auto Disburse
                        </mat-checkbox>

                        <mat-form-field appearance="outline" class="dense-field">
                            <input
                                matInput
                                placeholder="Input AutoDisburse"
                                autocomplete="off"
                                formControlName="AutoDisburse">
                        </mat-form-field>
                    </div>

                    <div class="field-row align-top">
                        <label>Cash Cash Account</label>
                        <mat-form-field appearance="outline" class="dense-field">
                            <mat-select formControlName="CashCashAccount">
                                <mat-option *ngFor="let v of cash" [value]="v.CashAccount">
                                    {{ v.CashAccount }}
                                </mat-option>
                            </mat-select>
                        </mat-form-field>
                    </div>

                    <div class="field-row align-top">
                        <label>Check Cash Account</label>
                        <mat-form-field appearance="outline" class="dense-field">
                            <mat-select formControlName="CheckCashAccount">
                                <mat-option *ngFor="let v of checks" [value]="v.CashAccount">
                                    {{ v.CashAccount }}
                                </mat-option>
                            </mat-select>
                        </mat-form-field>
                    </div>

                    <div class="field-row align-top">
                        <label>Bank Deposit Cash Account</label>
                        <mat-form-field appearance="outline" class="dense-field">
                            <mat-select formControlName="BankDepositCashAccount">
                                <mat-option *ngFor="let v of bankDeposits" [value]="v.CashAccount">
                                    {{ v.CashAccount }}
                                </mat-option>
                            </mat-select>
                        </mat-form-field>
                    </div>

                </div>
            </div>

            <div mat-dialog-actions align="end" class="mb-3">
                <button
                    type="button"
                    mat-button
                    color="primary"
                    class="me-3"
                    (click)="onClickReceivingConfigAccessRights()">
                    Config Access Rights
                </button>

                <button
                    type="submit"
                    class="mt-4 me-2"
                    mat-raised-button
                    color="primary"
                    [disabled]="receivingConfigForm.invalid || loading">
                    {{ btnText }}
                </button>

            </div>

        </form>
    </mat-card>
</div>

<button mat-icon-button class="close-button"  (click)="onClose()">
    <mat-icon class="close-icon" color="warn">close</mat-icon>
</button>
<h2 mat-dialog-title>UpdatePriceUI</h2>
<mat-divider></mat-divider>
<form [formGroup]="updatePriceForm" (ngSubmit)="onSubmit()">
    <div mat-dialog-content>
            <div class="row">
                <mat-form-field class="" appearance="standard">
                    <mat-label>UM</mat-label>
                    <input matInput placeholder="Input UM" autocomplete="off" required formControlName="UM" readonly>
                </mat-form-field>
            </div>
            <div class="row">
                    <mat-form-field class="" appearance="standard">
                        <mat-label>OldPrice</mat-label>
                        <input matInput placeholder="Input Price" type="text" mask="separator.2" thousandSeparator="," decimalMarker="." [dropSpecialCharacters]="true" [allowNegativeNumbers]="true" autocomplete="off" required formControlName="Price" readonly>
                    </mat-form-field>
                </div>
            <div class="row">
                <mat-form-field class="" appearance="standard">
                    <mat-label>NewPrice</mat-label>
                    <input matInput placeholder="Input NewPrice" type="text" mask="separator.2" thousandSeparator="," decimalMarker="." [dropSpecialCharacters]="true" [allowNegativeNumbers]="true" autocomplete="off" required formControlName="NewPrice">
                </mat-form-field>
            </div>
        </div>
        <div mat-dialog-actions [align]="'end'" class="mb-3">
            <button type="submit" class="mt-4 me-2" mat-raised-button color="primary" [disabled]="updatePriceForm.invalid || loading == true">{{btnText}}</button>
        </div>
  </form>

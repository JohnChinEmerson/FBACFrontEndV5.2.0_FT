<app-background-logo-ui></app-background-logo-ui>

<div class="content">
    <mat-card>
        <button mat-icon-button class="close-button" (click)="onClose()">
            <mat-icon class="close-icon" color="warn">close</mat-icon>
        </button>
        <h2 mat-dialog-title>OrderConfigUI</h2>
        <mat-divider></mat-divider>

        <form [formGroup]="orderConfigForm" (ngSubmit)="onSubmit()">
            <div mat-dialog-content>
                <div class="fields-container pt-3">
                    <div class="row-pair">
                        <div class="field-row">
                            <label>
                                <mat-checkbox [checked]="orderConfig.PopupQty == 'yes'" (change)="onCheck('PopupQty', $event.checked, orderConfig.PopupQty, 'Boolean')">Popup Qty:</mat-checkbox>
                            </label>
                            <input class="PopupQty" matInput placeholder="Input PopupQty" autocomplete="off" formControlName="PopupQty">
                        </div>
                        <div class="field-row">
                            <label>
                                <mat-checkbox [checked]="orderConfig.ReceiptLabel != null" (change)="onCheck('ReceiptLabel', $event.checked, orderConfig.ReceiptLabel, 'String')">Receipt Label:</mat-checkbox>
                            </label>
                            <input class="ReceiptLabel" matInput placeholder="Input ReceiptLabel" autocomplete="off" formControlName="ReceiptLabel">
                        </div>
                    </div>

                    <div class="row-pair">
                        <div class="field-row">
                            <label>
                                <mat-checkbox [checked]="orderConfig.DisableItemDiscount == 'yes'" (change)="onCheck('DisableItemDiscount', $event.checked, orderConfig.DisableItemDiscount, 'Boolean')">Disable ItemDiscount:</mat-checkbox>
                            </label>
                            <input class="DisableItemDiscount" matInput placeholder="Input DisableItemDiscount" autocomplete="off" formControlName="DisableItemDiscount">
                        </div>
                        <div class="field-row">
                            <label>
                                <mat-checkbox [checked]="orderConfig.DisableTransDate == 'yes'" (change)="onCheck('DisableTransDate', $event.checked, orderConfig.DisableTransDate, 'Boolean')">Disable TransDate:</mat-checkbox>
                            </label>
                            <input class="DisableTransDate" matInput placeholder="Input DisableTransDate" autocomplete="off" formControlName="DisableTransDate">
                        </div>
                    </div>

                    <div class="row-pair">
                        <div class="field-row">
                            <label>
                                <mat-checkbox [checked]="orderConfig.DisableReceiptDiscount == 'yes'" (change)="onCheck('DisableReceiptDiscount', $event.checked, orderConfig.DisableReceiptDiscount, 'Boolean')">Disable ReceiptDiscount:</mat-checkbox>
                            </label>
                            <input class="DisableReceiptDiscount" matInput placeholder="Input DisableReceiptDiscount" autocomplete="off" formControlName="DisableReceiptDiscount">
                        </div>
                        <div class="field-row">
                            <label>
                                <mat-checkbox [checked]="orderConfig.EditPrice == 'yes'" (change)="onCheck('EditPrice', $event.checked, orderConfig.EditPrice, 'Boolean')">Enable ItemPrice:</mat-checkbox>
                            </label>
                            <input class="EditPrice" matInput placeholder="Input EditPrice" autocomplete="off" formControlName="EditPrice">
                        </div>
                    </div>

                    <div class="notes-row">
                        <label>
                            <mat-checkbox [checked]="orderConfig.ReceiptNotes != null" (change)="onCheck('ReceiptNotes', $event.checked, orderConfig.ReceiptNotes, 'String')">Receipt Notes:</mat-checkbox>
                        </label>
                        <textarea matInput placeholder="Input ReceiptNotes" rows="2" autocomplete="off"  formControlName="ReceiptNotes"></textarea>
                    </div>
                </div>
            </div>

            <div mat-dialog-actions [align]="'end'" class="mb-3">
                <button type="submit" class="mt-4 me-2" mat-raised-button color="primary" [disabled]="orderConfigForm.invalid || loading == true">{{btnText}}</button>
            </div>
        </form>
    </mat-card>
</div>

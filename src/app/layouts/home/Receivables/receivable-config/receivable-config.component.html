<app-background-logo-ui></app-background-logo-ui>

<div class="content">
    <mat-card>
        <button mat-icon-button class="close-button" (click)="onClose()" aria-label="Close dialog">
            <mat-icon class="close-icon" color="warn">close</mat-icon>
        </button>

        <h2 mat-dialog-title>ReceivableConfigUI</h2>
        <mat-divider></mat-divider>

        <form [formGroup]="receivableConfigForm" (ngSubmit)="onSubmit()">

            <div mat-dialog-content>
                <div class="config-grid">

                    <div class="field-row align-top">
                        <label>Printer Type</label>
                        <mat-form-field appearance="outline" class="dense-field">
                            <mat-select
                                role="combobox"
                                [disableOptionCentering]="true"
                                formControlName="PrinterType"
                                required>
                                <mat-option value="ordinary">ORDINARY</mat-option>
                                <mat-option value="pos">POS</mat-option>
                            </mat-select>
                        </mat-form-field>
                    </div>

                </div>
            </div>

            <div mat-dialog-actions align="end" class="mb-3">
                <button
                    type="submit"
                    class="mt-4 me-2"
                    mat-raised-button
                    color="primary"
                    [disabled]="receivableConfigForm.invalid || loading">
                    {{ btnText }}
                </button>
            </div>

        </form>
    </mat-card>
</div>

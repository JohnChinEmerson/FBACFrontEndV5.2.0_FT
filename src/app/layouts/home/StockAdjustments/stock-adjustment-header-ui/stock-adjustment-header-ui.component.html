<button mat-icon-button class="close-button" (click)="onClose()">
    <mat-icon class="close-icon" color="warn">close</mat-icon>
</button>
<h2 mat-dialog-title>StockAdjustmentHeaderUI</h2>
<mat-divider></mat-divider>
<form [formGroup]="stockAdjustmentHeaderForm" (ngSubmit)="onSubmit()">
    <div mat-dialog-content class="sh-content" [class.sh-show-more]="showMore">
        <!-- phones: the amounts of this transaction, always in sight -->
        <div class="sh-summary d-md-none">
            <div>
                <span class="sh-summary-label">TOTAL AMOUNT</span>
                <span class="sh-summary-value">{{(+stockAdjustmentHeaderForm.controls['TotalAmount'].value || 0) | number:'1.2-2'}}</span>
            </div>
        </div>
        <div class="row">
            <div class="col-6 col-md-4">
                <mat-form-field appearance="standard" class="w-100">
                    <mat-label>TransDate</mat-label>
                    <input matInput [matDatepicker]="picker" formControlName="TransDate"  autocomplete="off" required>
                    <mat-datepicker-toggle matSuffix [for]="picker"></mat-datepicker-toggle>
                    <mat-datepicker #picker></mat-datepicker>
                </mat-form-field>
            </div>
            <div class="col-6 col-md-4">
                <mat-form-field class="w-100" appearance="standard">
                    <mat-label>AdjustmentType</mat-label>
                    <input matInput placeholder="Input AdjustmentType"  autocomplete="off" required formControlName="AdjustmentType" readonly>
                </mat-form-field>
            </div>
            <div class="col-12 col-md-4">
                <mat-form-field class="w-100" appearance="standard">
                    <mat-label>ReasonName</mat-label>
                    <input matInput placeholder="Input ReasonName" autocomplete="off" required formControlName="ReasonName" readonly >
                </mat-form-field>
            </div>
        </div>
        <div class="row">
            <div class="col-6 col-md-6">
                <mat-form-field class="w-100" appearance="standard">
                    <mat-label>TotalAmount</mat-label>
                    <input matInput placeholder="Input TotalAmount" type="text" mask="separator.2" thousandSeparator="," decimalMarker="." [dropSpecialCharacters]="true" [allowNegativeNumbers]="true"  autocomplete="off" required formControlName="TotalAmount" readonly>
                </mat-form-field>
            </div>
            <div class="col-6 col-md-6">
                <mat-form-field class="w-100" appearance="standard">
                    <mat-label>ReferenceNo</mat-label>
                    <input matInput placeholder="Input ReferenceNo"   autocomplete="off" required formControlName="ReferenceNo" >
                </mat-form-field>
            </div>
        </div>
        <div class="row">
            <div class="col-12">
                <mat-form-field class="w-100" appearance="standard">
                    <mat-label>Notes</mat-label>
                    <textarea  matInput placeholder="Input Notes" rows="1" autocomplete="off" required formControlName="Notes" ></textarea>
                </mat-form-field>
            </div>
        </div>
        <div class="row">
            <div class="col-6 col-md-6">
                <mat-form-field class="w-100"  appearance="standard">
                    <mat-label>ReportAs</mat-label>
                    <mat-select matInput role="combobox" [disableOptionCentering]="true" required required formControlName="ReportAs" (selectionChange)="onChangeReportAs($event)">
                        <mat-option  *ngFor="let x of reportAs" [value]="x">{{x.toUpperCase()}}</mat-option>
                    </mat-select>
                </mat-form-field>
            </div>
            <div class="col-6 col-md-6">
                <mat-form-field class="w-100" appearance="standard">
                    <mat-label>TermDays</mat-label>
                    <input matInput placeholder="Input TermDays" type="text" mask="separator.2" thousandSeparator="," decimalMarker="." [dropSpecialCharacters]="true" [allowNegativeNumbers]="true"    autocomplete="off" required formControlName="TermDays" [readOnly]="TermDaysReadOnly">
                </mat-form-field>
            </div>
        </div>
        <div class="row" *ngIf="this.adjustmentType == 'stockout'">
            <ng-select  
                [items]="branches" 
                [virtualScroll]="true" 
                appendTo="body" 
                formControlName="ToBranchName" 
                bindLabel="BranchName" 
                bindValue="BranchName"  
                [searchable]="true" 
                [clearable] = "false" 
                placeholder="ToBranchName" 
                (change)="onChangeBranchName($event)"
                required>
            </ng-select>
        </div>
        <div class="row" *ngIf="this.adjustmentType == 'stockin'">
            <ng-select  
                [items]="branches" 
                [virtualScroll]="true" 
                appendTo="body" 
                formControlName="FromBranchName" 
                bindLabel="BranchName" 
                bindValue="BranchName"  
                [searchable]="true" 
                [clearable] = "false" 
                placeholder="FromBranchName" 
                (change)="onChangeBranchName($event)"
                required>
            </ng-select>
        </div>
        <div mat-dialog-actions [align]="'end'" class="mb-3 sh-actions">
            <button type="button"    mat-button color="primary" class="me-3" >
                <mat-checkbox  [checked]="printReceipt" (change)="onChangePrintReceipt($event.checked)"   [disabled]="disablePrintReceipt">
                    <mat-label>Print Receipt</mat-label>
                </mat-checkbox>
            </button>
            <button type="button"    mat-button color="primary" class="me-3" (click)="onClickSignatures()">
                    <mat-label>Signatures</mat-label>
            </button>
            <button type="button" class="me-3 sh-save" (click)="validateForm()" mat-raised-button color="primary" [disabled]="stockAdjustmentHeaderForm.invalid || loading == true">{{btnText}}</button>
          </div>
    </div>
  </form>

<section class="content">
    <div class="search-div">
            <ng-select 
                [items]="months" 
                [virtualScroll]="true" 
                bindLabel="Label"
                bindValue="Value"
                appendTo="body" 
                [(ngModel)]="month" 
                [searchable]="true" 
                [clearable] = "false" 
                placeholder="Month"
                class="w-10"
                >
            </ng-select>
            <ng-select 
                [items]="years" 
                [virtualScroll]="true" 
                appendTo="body" 
                [(ngModel)]="year" 
                [searchable]="true" 
                [clearable] = "false" 
                placeholder="Year"
                class="w-10"
                >
            </ng-select>
            <ng-select
                [items]="items" 
                bindLabel="ItemName"
                bindValue="ItemId"
                [virtualScroll]="true" 
                appendTo="body" 
                [(ngModel)]="itemId" 
                [searchable]="true" 
                [clearable] = "false" 
                placeholder="ItemName"
                class="w-10"
                >
            </ng-select>
            <mat-form-field appearance="standard">
                <mat-label>AdjustmentType</mat-label>
                <mat-select role="combobox" [disableOptionCentering]="true" required [(ngModel)]="adjustmentType" (selectionChange)="emptyTable()">
                    <mat-option  *ngFor="let x of adjustmentTypes" [value]="x">{{x.toUpperCase()}}</mat-option>
                </mat-select>
            </mat-form-field>
            <mat-form-field class="w-20" floatLabel="never"  appearance="standard">
                <input matInput [(ngModel)]="searchKey" placeholder="Search" (keyup)="applyFilter()" autocomplete="false">
                <button mat-button matSuffix mat-icon-button aria-label="Clear" (click)="clearSearch()">
                <mat-icon>close</mat-icon>
                </button>
            </mat-form-field>
            <button mat-raised-button color="primary" *ngFor="let tB of toolButtons" [disabled]="!tB.Disabled" (click)="tB.Function()" >{{tB.Label}}</button> 
    </div>
    <div class="mat-elevation-z2 w-100">
        <div class="mat-elevation-z2">
            <mat-table [dataSource]="listData" matSort >
                <ng-container *ngFor="let dc of defaultColumns">
                    <ng-container  [matColumnDef]="dc">
                    <mat-header-cell *matHeaderCellDef sticky>{{ dc }}</mat-header-cell>
                        <mat-cell  *matCellDef="let element"  class="auto-adjust-cell" [ngClass]="element | rowClasses:dc:columnTypeMap[dc]" [title]="element[dc]">
                        <span>{{ element | rowDisplay:dc:columnTypeMap[dc] }}</span>
                        </mat-cell>
                        <mat-footer-cell *matFooterCellDef class="footer" [ngClass]="columnTypeMap[dc]">
                            <ng-container [ngSwitch]="columnTypeMap[dc]">
                                <span *ngSwitchCase="'decimal'">{{ listData | columnTotal:dc | number:'1.2-2' }}</span>
                                <span *ngSwitchCase="'int'">{{ listData | columnTotal:dc | number:'1.0-0' }}</span>
                                <span *ngSwitchDefault></span>
                            </ng-container>
                        </mat-footer-cell>
                    </ng-container>
                </ng-container>
                <ng-container matColumnDef="loading">
                    <mat-footer-cell *matFooterCellDef colspan="6">
                        <mat-progress-bar color="primary" mode="indeterminate"></mat-progress-bar>
                    </mat-footer-cell>
                </ng-container>
                <ng-container matColumnDef="noData">
                    <mat-footer-cell *matFooterCellDef colspan="6">
                        No data.
                    </mat-footer-cell>
                </ng-container>
                <mat-header-row *matHeaderRowDef="defaultColumns; sticky:true"></mat-header-row>
                <mat-row  *matRowDef="let row; columns: defaultColumns;"></mat-row>
                <mat-footer-row *matFooterRowDef="['loading']" [ngClass]="{'hide':!isLoading}"></mat-footer-row>
                <mat-footer-row *matFooterRowDef="['noData']" [ngClass]="{'hide':!(listData!=null && listData.data.length==0)}"></mat-footer-row>
                <mat-footer-row [ngClass]="{'hide':(listData!=null && listData.data.length==0)}" *matFooterRowDef="defaultColumns;"></mat-footer-row>
            </mat-table>
          <mat-paginator class="mat-paginator-sticky" [pageSize]="31" [pageSizeOptions]="pageSizeOptions" showFirstLastButtons> </mat-paginator>
        </div>
    </div>
</section>

<button mat-icon-button class="close-button" [mat-dialog-close]="true">
    <mat-icon class="close-icon" color="warn">close</mat-icon>
</button>
<h2 mat-dialog-title>StockAdjustmentDetailUI</h2>
<mat-divider></mat-divider>
<form [formGroup]="stockAdjustmentDetailForm" (ngSubmit)="onSubmit()">
    <div mat-dialog-content>
        <div class="row">
            <mat-form-field class="" appearance="standard">
                <mat-label>ItemName</mat-label>
                <input matInput placeholder="Input ItemName" autocomplete="off" required formControlName="ItemName" readonly>
            </mat-form-field>
        </div>
        <div class="row">
             <ng-select  
                [items]="unitMeasures" 
                [virtualScroll]="true" 
                appendTo="body" 
                formControlName="UM" 
                bindLabel="UM" 
                bindValue="UM"  
                [searchable]="true" 
                [clearable] = "false" 
                placeholder="UM" 
                (change)="onChangeUM($event)"
                required>
            </ng-select>
            <!-- <mat-form-field class="w-100"  appearance="standard">
                <mat-label>UM</mat-label>
                <input matInput placeholder="Input UM" autocomplete="off" required formControlName="UM" readonly>
            </mat-form-field> -->
        </div>
        <div class="row">
            <div class="col-6">
                <mat-form-field class="w-100"  appearance="standard">
                    <mat-label>Price</mat-label>
                    <input matInput placeholder="Input Price" type="text" mask="separator.4" thousandSeparator="," decimalMarker="." [dropSpecialCharacters]="true" [allowNegativeNumbers]="true" autocomplete="off" required formControlName="Price" >
                </mat-form-field>
            </div>
            <div class="col-6">
                <mat-form-field class="w-100"  appearance="standard">
                    <mat-label>PriceType</mat-label>
                    <mat-select matInput role="combobox" [disableOptionCentering]="true" required required formControlName="PriceType" (selectionChange)="onChangePriceType($event)">
                        <mat-option  *ngFor="let x of priceTypes" [value]="x">{{x.toUpperCase()}}</mat-option>
                    </mat-select>
                </mat-form-field>
            </div>
        </div>
        <div class="row">
            <mat-form-field class="w-100"  appearance="standard">
                <mat-label>Qty</mat-label>
                <input #qtyInput matInput placeholder="Input Qty" type="text" mask="separator.2" thousandSeparator="," decimalMarker="." [dropSpecialCharacters]="true" [allowNegativeNumbers]="true" autocomplete="off" required formControlName="Qty" (keyup.enter)="onEnterQty()">
            </mat-form-field>
        </div>
     
        <div class="row" *ngIf="adjustmentType.toLowerCase() == 'stockin'">
            <div class="col-6">
                <mat-form-field class="w-100" appearance="standard">
                    <mat-checkbox (change)="onCheckExpiryDate($event.checked)" [checked]="chkExpiry" ></mat-checkbox>
                    <mat-label> ExpiryDate</mat-label>
                    <input matInput [matDatepicker]="picker" formControlName="ExpiryDate"  autocomplete="off">
                    <mat-datepicker-toggle matSuffix [for]="picker"></mat-datepicker-toggle>
                    <mat-datepicker #picker></mat-datepicker>
                </mat-form-field>
            </div>
            <div class="col-6">
                <mat-form-field  class="w-100" appearance="standard">
                    <mat-label>BatchLotNo</mat-label>
                    <input class="BatchLotNo" matInput placeholder="Input BatchLotNo"  autocomplete="off" required formControlName="BatchLotNo">
                </mat-form-field>
            </div>
        </div>
        <div class="row" *ngIf="adjustmentType.toLowerCase() == 'stockout'">
            <div class="col align-elements">
                <mat-form-field appearance="standard">
                    <mat-label>ExpiryDate</mat-label>
                    <input matInput placeholder="Input ExpiryDate" autocomplete="off" required formControlName="ExpiryDate" readonly>
                </mat-form-field>
                <mat-form-field appearance="standard">
                    <mat-label>BatchLotNo</mat-label>
                    <input matInput placeholder="Input BatchLotNo" autocomplete="off" required formControlName="BatchLotNo" readonly>
                </mat-form-field>
                <button type="button" (click)="onClickExpiry()"  mat-icon-button color="primary" title="Expiry Dates"><mat-icon>list</mat-icon></button>
            </div>
        </div>

      
        
    </div>
    <div mat-dialog-actions [align]="'end'" class="mb-3">
        <button type="button"  (click)="onSubmit()" class="mt-4 me-2" mat-raised-button color="primary" [disabled]="stockAdjustmentDetailForm.invalid || loading == true">{{btnText}}</button>
    </div>
  </form>

<button mat-icon-button class="close-button" [mat-dialog-close]="true">
    <mat-icon class="close-icon" color="warn">close</mat-icon>
</button>
<h2 mat-dialog-title>Change PasswordUI</h2>
<mat-divider></mat-divider>
<form [formGroup]="UserForm" (ngSubmit)="validateForm()">
    <div mat-dialog-content>
        <div class="row">
            <mat-form-field class="" appearance="standard">
                <mat-label>OldPassword</mat-label>
                <input matInput placeholder="Input OldPassword" type="password" autocomplete="off" required formControlName="OldPassword">
            </mat-form-field>
        </div>
      
        <div class="row">
            <mat-form-field class="" appearance="standard">
                <mat-label>NewPassword</mat-label>
                <input matInput placeholder="Input Password" type="password" autocomplete="off" required formControlName="Password">
            </mat-form-field>
        </div>
        <div class="row">
            <mat-form-field class="" appearance="standard">
                <mat-label>ConfirmPassword</mat-label>
                <input matInput placeholder="Input ConfirmPassword"  type="password"  autocomplete="off" required formControlName="ConfirmPassword">
            </mat-form-field>
        </div>
        </div>
    <div mat-dialog-actions [align]="'end'" class="mb-3">
      <button type="submit" class="mt-4 me-2" mat-raised-button color="primary" [disabled]="UserForm.invalid || loading == true">{{btnText}}</button>
    </div>
  </form>

<section class="content">
    <div class="date-cont">
        <mat-form-field appearance="standard">
            <mat-label>TransDateFrom</mat-label>
            <input matInput [matDatepicker]="picker" [(ngModel)]="TransDateFrom"  autocomplete="off"  required>
            <mat-datepicker-toggle matSuffix [for]="picker"></mat-datepicker-toggle>
            <mat-datepicker #picker></mat-datepicker>
        </mat-form-field>
        <mat-form-field appearance="standard">
            <mat-label>TransDateTo</mat-label>
            <input matInput [matDatepicker]="picker2" [(ngModel)]="TransDateTo"  autocomplete="off"  required>
            <mat-datepicker-toggle matSuffix [for]="picker2"></mat-datepicker-toggle>
            <mat-datepicker #picker2></mat-datepicker>
        </mat-form-field>
        <ng-select
                class="w-10"
                [items]="UserFullNames" 
                [virtualScroll]="true" 
                appendTo="body" 
                [(ngModel)]="SelectedUser" 
                [searchable]="true" 
                [clearable] = "false" 
                placeholder="UserFullName"
                (change)="displayRecords()"
                >
        </ng-select>
        <ng-select
                class="w-10"
                [items]="AccessRights" 
                [virtualScroll]="true" 
                appendTo="body" 
                [(ngModel)]="SelectedAccessRight" 
                [searchable]="true" 
                [clearable] = "false" 
                placeholder="AccessRight"
                (change)="displayRecords()"
                >
        </ng-select>
        <ng-select
                class="w-10"
                [items]="Modules" 
                [virtualScroll]="true" 
                appendTo="body" 
                [(ngModel)]="SelectedModule" 
                [searchable]="true" 
                [clearable] = "false" 
                placeholder="Module"
                (change)="displayRecords()"
                >
        </ng-select>
        <ng-select
                class="w-10"
                [items]="Types" 
                appendTo="body" 
                [(ngModel)]="SelectedType" 
                [searchable]="false" 
                [clearable] = "false" 
                placeholder="Type"
                (change)="displayRecords()"
                >
        </ng-select>
        <ng-select
                class="w-15"
                [items]="Actions" 
                [virtualScroll]="true" 
                appendTo="body" 
                [(ngModel)]="SelectedAction" 
                [searchable]="true" 
                [clearable] = "false" 
                placeholder="Action"
                (change)="displayRecords()"
                >
        </ng-select>
        <ng-select 
            [items]="branches" 
            [virtualScroll]="true" 
            appendTo="body" 
            bindLabel="BranchName"
            bindValue="BranchId"
            [(ngModel)]="branchId" 
            [searchable]="true" 
            [clearable] = "false" 
            placeholder="Branch"
            class="w-10"
            >
        </ng-select>
        <button mat-raised-button color="primary" *ngFor="let tB of toolButtons" [disabled]="!tB.Disabled" (click)="tB.Function()" >{{tB.Label}}</button> 
    </div>
   
    <div class="mat-elevation-z2 w-100">
        <div class="date-cont">
            <mat-form-field class="search-form-field " floatLabel="never"  appearance="standard">
                <input matInput [(ngModel)]="searchKey" placeholder="Search" (keyup)="applyFilter()" autocomplete="false">
                <button mat-button matSuffix mat-icon-button aria-label="Clear" (click)="clearSearch()">
                <mat-icon>close</mat-icon>
                </button>
            </mat-form-field>
        </div>
        <p class="feed-note" *ngIf="UserActivities && feedTotal > UserActivities.length">
            Showing the newest {{ UserActivities.length | number }} of {{ feedTotal | number }} activities of this period. Choose a shorter period to see the rest.
        </p>
        <mat-table [dataSource]="listData" matSort>
            <ng-container *ngFor="let dc of defaultColumns">
                <ng-container  [matColumnDef]="dc">
                <mat-header-cell *matHeaderCellDef sticky>{{ dc }}</mat-header-cell>
                    <mat-cell  *matCellDef="let element"  class="auto-adjust-cell" [ngClass]="element | rowClasses:dc:columnTypeMap[dc]" [title]="element[dc]">
                    <span>{{ element | rowDisplay:dc:columnTypeMap[dc] }}</span>
                    </mat-cell>
                </ng-container>
            </ng-container>
            <ng-container matColumnDef="loading">
                <mat-footer-cell *matFooterCellDef colspan="6">
                    <mat-progress-bar color="primary" mode="indeterminate"></mat-progress-bar>
                </mat-footer-cell>
            </ng-container>
            <ng-container matColumnDef="noData">
                <mat-footer-cell *matFooterCellDef colspan="6">
                    No data.
                </mat-footer-cell>
            </ng-container>
            <mat-header-row *matHeaderRowDef="defaultColumns; sticky:true"></mat-header-row>
            <mat-row  (click)="getRecord(row)" (dblclick)="onDoubleClick(row)" *matRowDef="let row; columns: defaultColumns;" [ngClass]="{'data-selected': selectedId == row.id, 'data-void': (row.RecordStatus == 'void' && selectedId != row.id)}"></mat-row>
            <mat-footer-row *matFooterRowDef="['loading']" [ngClass]="{'hide':!isLoading}"></mat-footer-row>
            <mat-footer-row *matFooterRowDef="['noData']" [ngClass]="{'hide':!(listData!=null && listData.data.length==0)}"></mat-footer-row>
        </mat-table>
      <mat-paginator class="mat-paginator-sticky" [pageSize]="20" [pageSizeOptions]="pageSizeOptions" showFirstLastButtons> </mat-paginator>
    </div>
</section>

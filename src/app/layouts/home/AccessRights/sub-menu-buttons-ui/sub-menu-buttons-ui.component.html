<button mat-icon-button class="close-button" [mat-dialog-close]="true">
    <mat-icon class="close-icon" color="warn">close</mat-icon>
</button>
<h2 mat-dialog-title>SubMenuButtonsUI - {{SubMenu.SubMenuName }}</h2>
<mat-divider></mat-divider>
<div class="search-div">
    <mat-form-field class="w-25" floatLabel="never"  appearance="standard">
        <input matInput [(ngModel)]="searchKey" placeholder="Search" (keyup)="applyFilter()" autocomplete="false" (keyup.enter)="onClickSave()">
        <button mat-button matSuffix mat-icon-button aria-label="Clear" (click)="clearSearch()">
        <mat-icon>close</mat-icon>
        </button>
    </mat-form-field>
    <button type="button" mat-raised-button color="primary" (click)="onClickSave()"> Save</button>
</div>
<div class="mat-elevation-z1 table-cont">
    <mat-table [dataSource]="listData" matSort>
        <ng-container *ngFor="let dc of defaultColumns">
                <ng-container  [matColumnDef]="dc">
                <mat-header-cell *matHeaderCellDef sticky>{{ dc }}</mat-header-cell>
                    <mat-cell  *matCellDef="let element"  class="auto-adjust-cell" [ngClass]="element | rowClasses:dc:columnTypeMap[dc]" [title]="element[dc]">
                        <ng-container [ngSwitch]="dc">
                            <span *ngSwitchCase="'actions'">
                                <button mat-icon-button color="warn" (click)="onDelete(element.id)"><mat-icon>delete</mat-icon> </button>
                            </span>
                            <span *ngSwitchDefault>
                                {{ element | rowDisplay:dc:columnTypeMap[dc] }}
                            </span>
                        </ng-container>
                    </mat-cell>
                </ng-container>
            </ng-container>

        <ng-container matColumnDef="loading">
            <mat-footer-cell *matFooterCellDef colspan="6">
                <mat-progress-bar color="primary" mode="indeterminate"></mat-progress-bar>
            </mat-footer-cell>
        </ng-container>
        <ng-container matColumnDef="noData">
            <mat-footer-cell *matFooterCellDef colspan="6">
                No data.
            </mat-footer-cell>
        </ng-container>
        <mat-header-row *matHeaderRowDef="defaultColumns; sticky:true"></mat-header-row>
        <mat-row *matRowDef="let row; columns: defaultColumns;"></mat-row>
        <mat-footer-row *matFooterRowDef="['loading']" [ngClass]="{'hide':listData!=null}"></mat-footer-row>
        <mat-footer-row *matFooterRowDef="['noData']"
            [ngClass]="{'hide':!(listData!=null && listData.data.length==0)}"></mat-footer-row>
    </mat-table>
    <mat-paginator class="mat-paginator-sticky" [pageSize]="15" [pageSizeOptions]="pageSizeOptions" showFirstLastButtons> </mat-paginator>
</div>

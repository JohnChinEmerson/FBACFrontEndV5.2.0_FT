<div class="content">
    <div class="search-div">
        <ng-select 
            [items]="branches" 
            [virtualScroll]="true" 
            appendTo="body" 
            bindLabel="BranchName"
            bindValue="BranchId"
            [(ngModel)]="branchId" 
            [searchable]="true" 
            [clearable] = "false" 
            placeholder="Branch"
            class="w-10"
            (change)="LoadAccessRights()"
            >
        </ng-select>
        <mat-form-field  appearance="standard">
            <mat-label>AccessRights</mat-label>
            <mat-select role="combobox" (selectionChange)="GetAccessRightMenus()" [disableOptionCentering]="true"
                [(ngModel)]="accessRightId">
                <mat-option *ngFor="let accessRight of accessRights" [value]="accessRight.id">
                    {{accessRight.AccessRightName}}
                </mat-option>
            </mat-select>
        </mat-form-field>
        <button mat-raised-button color="primary" (click)="onCreate()"> AccessRights</button>
    </div>
    <div class="mat-elevationz-z2 row g-2 ">
        <div class="col-12 col-md-4 mat-elevation-z2">
            <div class="search-div">
                <mat-form-field class="w-50"  floatLabel="never" appearance="standard">
                    <input matInput placeholder="Search" [(ngModel)]="searchKey" (keyup)="applyFilter()" autocomplete="false">
                    <button mat-button matSuffix mat-icon-button aria-label="Clear" (click)="clearSearch()">
                        <mat-icon>close</mat-icon>
                    </button>
                </mat-form-field>
                <button mat-raised-button color="primary"   (click)="addMenu()"> Menu</button>
            </div>
            <div class="table-cont">
                <mat-table [dataSource]="listData" matSort>
                    <ng-container *ngFor="let dc of defaultColumns">
                        <ng-container  [matColumnDef]="dc">
                        <mat-header-cell *matHeaderCellDef sticky>{{ dc }}</mat-header-cell>
                            <mat-cell  *matCellDef="let element"  class="auto-adjust-cell" [ngClass]="element | rowClasses:dc:columnTypeMap[dc]" [title]="element[dc]">
                            <span>{{ element | rowDisplay:dc:columnTypeMap[dc] }}</span>
                            </mat-cell>
                        </ng-container>
                    </ng-container>
                    <ng-container matColumnDef="loading">
                        <mat-footer-cell *matFooterCellDef colspan="6">
                            <mat-progress-bar color="primary" mode="indeterminate"></mat-progress-bar>
                        </mat-footer-cell>
                    </ng-container>
                    <ng-container matColumnDef="noData">
                        <mat-footer-cell *matFooterCellDef colspan="6">
                            No data.
                        </mat-footer-cell>
                    </ng-container>
                    <mat-header-row *matHeaderRowDef="defaultColumns; sticky:true"></mat-header-row>
                    <mat-row *matRowDef="let row; columns: defaultColumns;"  [ngClass]="{'data-selected': selectedRowIndex == row.MenuId}" (click)="selectedRow(row)" appTouchContextMenu (contextmenu)="onContextMenu($event, row, 'menu')"></mat-row>
                    <mat-footer-row *matFooterRowDef="['loading']" [ngClass]="{'hide':listData!=null}"></mat-footer-row>
                    <mat-footer-row *matFooterRowDef="['noData']"
                        [ngClass]="{'hide':!(listData!=null && listData.data.length==0)}"></mat-footer-row>
                </mat-table>
                <mat-paginator #paginator1 class="mat-paginator-sticky" [pageSize]="20" [pageSizeOptions]="pageSizeOptions"> </mat-paginator>
            </div>
        </div>
        <div class="col-12 col-md-4  mat-elevation-z2">
            <div class="search-div">
                <mat-form-field class="w-50" floatLabel="never" appearance="standard">
                    <input matInput placeholder="Search" [(ngModel)]="searchKey2" (keyup)="applyFilter2()" autocomplete="false">
                    <button mat-button matSuffix mat-icon-button aria-label="Clear" (click)="clearSearch2()">
                        <mat-icon>close</mat-icon>
                    </button>
                </mat-form-field>
                <button mat-raised-button color="primary" (click)="addSubMenu()"> SubMenu</button>
            </div>
            <div class="table-cont">
                <mat-table [dataSource]="listData2" matSort>
                    <ng-container *ngFor="let dc of defaultColumns2">
                        <ng-container  [matColumnDef]="dc">
                        <mat-header-cell *matHeaderCellDef sticky>{{ dc }}</mat-header-cell>
                            <mat-cell  *matCellDef="let element"  class="auto-adjust-cell" [ngClass]="element | rowClasses:dc:columnTypeMap2[dc]" [title]="element[dc]">
                            <span>{{ element | rowDisplay:dc:columnTypeMap2[dc] }}</span>
                            </mat-cell>
                        </ng-container>
                    </ng-container>
                    <ng-container matColumnDef="loading">
                        <mat-footer-cell *matFooterCellDef colspan="6">
                            <mat-progress-bar color="primary" mode="indeterminate"></mat-progress-bar>
                        </mat-footer-cell>
                    </ng-container>
                    <ng-container matColumnDef="noData">
                        <mat-footer-cell *matFooterCellDef colspan="6">
                            No data.
                        </mat-footer-cell>
                    </ng-container>
                    <mat-header-row *matHeaderRowDef="defaultColumns2; sticky:true"></mat-header-row>
                    <mat-row *matRowDef="let row; columns: defaultColumns2;" [ngClass]="{'data-selected': selectedSubMenuId == row.SubMenuId}" (click)="selectedRow2(row)" appTouchContextMenu (contextmenu)="onContextMenu($event, row, 'submenu')"></mat-row>
                    <mat-footer-row *matFooterRowDef="['loading']" [ngClass]="{'hide':listData2!=null}"></mat-footer-row>
                    <mat-footer-row *matFooterRowDef="['noData']"
                        [ngClass]="{'hide':!(listData2!=null && listData2.data.length==0)}"></mat-footer-row>
                </mat-table>
                <mat-paginator  #paginator2 class="mat-paginator-sticky" [pageSize]="20" [pageSizeOptions]="pageSizeOptions"> </mat-paginator>
            </div>
        </div>
        <div class="col-12 col-md-4  mat-elevation-z2">
            <div class="search-div">
                <mat-form-field class="w-50" floatLabel="never" appearance="standard">
                    <input matInput placeholder="Search" [(ngModel)]="searchKey3" (keyup)="applyFilter3()" autocomplete="false">
                    <button mat-button matSuffix mat-icon-button aria-label="Clear" (click)="clearSearch3()">
                        <mat-icon>close</mat-icon>
                    </button>
                </mat-form-field>
                <button mat-raised-button color="primary" (click)="addSubMenuButton()"> Button</button>
            </div>
            <div class="table-cont">
                <mat-table [dataSource]="listData3" matSort>
                     <ng-container *ngFor="let dc of defaultColumns3">
                        <ng-container  [matColumnDef]="dc">
                        <mat-header-cell *matHeaderCellDef sticky>{{ dc }}</mat-header-cell>
                            <mat-cell  *matCellDef="let element"  class="auto-adjust-cell" [ngClass]="element | rowClasses:dc:columnTypeMap3[dc]" [title]="element[dc]">
                            <span>{{ element | rowDisplay:dc:columnTypeMap3[dc] }}</span>
                            </mat-cell>
                        </ng-container>
                    </ng-container>
                    <ng-container matColumnDef="loading">
                        <mat-footer-cell *matFooterCellDef colspan="6">
                            <mat-progress-bar color="primary" mode="indeterminate"></mat-progress-bar>
                        </mat-footer-cell>
                    </ng-container>
                    <ng-container matColumnDef="noData">
                        <mat-footer-cell *matFooterCellDef colspan="6">
                            No data.
                        </mat-footer-cell>
                    </ng-container>
                    <mat-header-row *matHeaderRowDef="defaultColumns3; sticky:true"></mat-header-row>
                    <mat-row *matRowDef="let row; columns: defaultColumns3;" (click)="selectedRow3(row)"  [ngClass]="{'data-selected': selectedSubMenuButtonId == row.SubMenuButtonId}" appTouchContextMenu (contextmenu)="onContextMenu($event, row, 'button')"></mat-row>
                    <mat-footer-row *matFooterRowDef="['loading']" [ngClass]="{'hide':listData3!=null}"></mat-footer-row>
                    <mat-footer-row *matFooterRowDef="['noData']"
                        [ngClass]="{'hide':!(listData3!=null && listData3.data.length==0)}"></mat-footer-row>
                </mat-table>
                <mat-paginator  #paginator3 class="mat-paginator-sticky" [pageSize]="20" [pageSizeOptions]="pageSizeOptions"> </mat-paginator>
            </div>
        </div>
    </div>
</div>
<div style="visibility: hidden; position: fixed"
    [style.left]="contextMenuPosition.x"
    [style.top]="contextMenuPosition.y"
    [matMenuTriggerFor]="contextMenu">
</div>
<mat-menu #contextMenu="matMenu">
	<ng-template matMenuContent let-data="data">
		<button mat-menu-item (click)="onDeleteAccessRightMenu(data.id)" *ngIf="DeleteType == 'menu'"> <mat-icon color="basic">delete</mat-icon> Delete</button>
		<button mat-menu-item (click)="onDeleteAccessRightSubMenu(data.id)" *ngIf="DeleteType == 'submenu'"> <mat-icon color="basic">delete</mat-icon> Delete</button>
		<button mat-menu-item (click)="onDeleteAccessRightSubMenuButton(data.id)" *ngIf="DeleteType == 'button'"> <mat-icon color="basic">delete</mat-icon> Delete</button>
	</ng-template>
</mat-menu>

<app-background-logo-ui></app-background-logo-ui>

<div class="content">
    <mat-card>
        <button mat-icon-button class="close-button" (click)="onClose()" aria-label="Close dialog">
            <mat-icon class="close-icon" color="warn">close</mat-icon>
        </button>
        <h2 mat-dialog-title>POConfigUI</h2>
        <mat-divider></mat-divider>

        <form [formGroup]="poConfigForm" (ngSubmit)="onSubmit()">
            <div mat-dialog-content>
                <div class="config-grid">

                    <div class="field-row">
                        <mat-checkbox
                            [checked]="poConfig.AutoVoucher == 'yes'"
                            (change)="onCheck('AutoVoucher', $event.checked, poConfig.AutoVoucher, 'Boolean')">
                            Auto Voucher
                        </mat-checkbox>
                        <mat-form-field appearance="outline" class="dense-field">
                            <input
                                matInput
                                placeholder="Input AutoVoucher"
                                autocomplete="off"
                                formControlName="AutoVoucher"
                                [disabled]="true">
                        </mat-form-field>
                    </div>

                    <div class="field-row">
                        <mat-checkbox
                            [checked]="poConfig.SortByAvailable == 'yes'"
                            (change)="onCheck('SortByAvailable', $event.checked, poConfig.SortByAvailable, 'Boolean')">
                            Sort By Available
                        </mat-checkbox>
                        <mat-form-field appearance="outline" class="dense-field">
                            <input
                                matInput
                                placeholder="Input SortByAvailable"
                                autocomplete="off"
                                formControlName="SortByAvailable">
                        </mat-form-field>
                    </div>

                </div>
            </div>

            <div mat-dialog-actions [align]="'end'" class="mb-3">
                <button
                    type="submit"
                    class="mt-4 me-2"
                    mat-raised-button
                    color="primary"
                    [disabled]="poConfigForm.invalid || loading == true">
                    {{btnText}}
                </button>
            </div>
        </form>
    </mat-card>
</div>

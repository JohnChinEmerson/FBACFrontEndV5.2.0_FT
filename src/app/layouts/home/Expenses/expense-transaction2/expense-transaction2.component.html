
<div class="main-transaction-container g-5">
  <div class="mat-elevation-z4 left-panel">
    <div class="sticky-top-toolbar">
      <div class="row g-2 ms-2 me-2">
        <div class="col-12 col-md-9">
          <ng-select 
            [items]="payees"  
              placeholder="PayeeName" 
              bindLabel="PayeeName"  
              bindValue="PayeeId"   
              [searchable]="true"   
              [clearable] = "false"
              [(ngModel)]="payeeId"
              [virtualScroll]="true"
              (change)="onChangePayee($event)"
              appendTo="body"   
            >
          </ng-select>
        </div>
        <div class="col-12 col-md-3 ">
          <button mat-raised-button color="default" class="mt-3 w-100" *ngFor="let tB of toolButtons"
                  [title]="tB.Label"
                  [disabled]="!tB.Disabled"
                  (click)="tB.Function()">
            <mat-label>{{tB.Label}}</mat-label>
          </button>
        </div>
      </div>
      <div class="row g-2 ms-2 me-2">
        <div class="col-12 col-md-7">
          <mat-form-field class="w-100" appearance="standard" floatLabel="never">
            <input #searchInput matInput [(ngModel)]="searchKey1" placeholder="Search" (keyup)="applyFilter()" (keyup.enter)="applyFilter2()" (keyup.arrowdown)="getFirstRecord()" autocomplete="off">
          </mat-form-field>
        </div>
        <div class="col-12 col-md-2">
          <mat-form-field class="w-100" appearance="standard" floatLabel="never">
            <input matInput #qtyInput [(ngModel)]="qty" placeholder="Amount" (keyup.enter)="onFocusQty()" autocomplete="off">
          </mat-form-field>
        </div>
        <div class="col-12 col-md-3">
          <button mat-raised-button color="default" class="mt-2 w-100" *ngFor="let tB of toolButtons2"
                  [title]="tB.Label"
                  [disabled]="!tB.Disabled"
                  (click)="tB.Function()">
            <mat-label>{{tB.Label}}</mat-label>
          </button>
        </div>
      </div>
    </div>
    <div #tableContainer class="itemListTransaction" >
        <mat-table #dataTable [dataSource]="listData1" matSort   tabindex="0" (keydown)="onKeyDown($event)" (keyup.enter)="onFocusQty()">
           <ng-container *ngFor="let dc of defaultColumns">
              <ng-container [matColumnDef]="dc">
                <mat-header-cell *matHeaderCellDef sticky>{{ dc }}</mat-header-cell>
                <mat-cell *matCellDef="let element"
                          class="auto-adjust-cell"
                          [ngClass]="element | rowClasses:dc:columnTypeMap[dc]"
                          [title]="element[dc]">
                  <span>{{ element | rowDisplay:dc:columnTypeMap[dc] }}</span>
                </mat-cell>
              </ng-container>
            </ng-container>
            <ng-container matColumnDef="loading">
                <mat-footer-cell *matFooterCellDef colspan="6">
                    <mat-progress-bar color="primary" mode="indeterminate"></mat-progress-bar>
                </mat-footer-cell>
            </ng-container>
            <ng-container matColumnDef="noData">
                <mat-footer-cell *matFooterCellDef colspan="6">
                    No data.
                </mat-footer-cell>
            </ng-container>
            <mat-header-row *matHeaderRowDef="defaultColumns; sticky:true"></mat-header-row>
            <mat-row   #rowElement (click)="getRecord1(row)" (dblclick)="onFocusQty()" *matRowDef="let row; columns: defaultColumns;" [ngClass]="{'data-selected': particularId == row.ParticularId ||  row === selectedRowIndex}" ></mat-row>
            <mat-footer-row *matFooterRowDef="['loading']" [ngClass]="{'hide':!isLoading1}"></mat-footer-row>
            <mat-footer-row *matFooterRowDef="['noData']" [ngClass]="{'hide':!(listData1!=null && listData1.data.length==0)}"></mat-footer-row>
        </mat-table>
    </div>
  </div>

  <div class="mat-elevation-z4 right-panel">
    <div class="sticky-top-toolbar2 ">
      <div class="row g-2 ms-2 me-2 mt-3 mb-4">
        <div class="subtitle-row">
          <h2 class="m-0 me-2 totalAmount">
            TOTAL AMOUNT: {{ totalAmount | number: '1.2-2' }}
          </h2>
        </div>
      </div>
    </div>
    <div class="itemListTransaction2"  appTouchContextMenu (contextmenu)="onContextMenu($event, null, 'expensedetails')"> 
        <mat-table [dataSource]="listData2" matSort>
            <ng-container *ngFor="let dc of defaultColumns2">
            <ng-container [matColumnDef]="dc">
              <mat-header-cell *matHeaderCellDef sticky>{{ dc }}</mat-header-cell>
              <mat-cell *matCellDef="let element"
                        class="auto-adjust-cell"
                        [ngClass]="element | rowClasses:dc:columnTypeMap2[dc]"
                        [title]="element[dc]">
                <ng-container [ngSwitch]="dc">
                  <span *ngSwitchCase="'Amount'">
                        <input matInput placeholder="Input Amount" class="clickable inputtable" title="Input Amount" type="text" step="0.01"  (keyup.enter)="updateElementExpenseDetail($event,element.id, 'Amount' )"  [value]="element.Amount | number:'1.2-2'" autocomplete="false" >
                  </span>
                 
                  <span *ngSwitchCase="'DiscountValue'" class="discount-cell">
                    <input matInput placeholder="Input DiscountValue" class="clickable inputtable" type="text" step="0.01"
                          (keyup.enter)="updateElementExpenseDetail($event,element.id,'DiscountValue')"
                          [value]="element.DiscountValue | number:'1.2-2'" autocomplete="off">
                    <div class="discount-select-wrap" >
                      <span class="discount-icon">{{ element.DiscountType === 'percent' ? '%' : '₱' }}
                        <mat-icon>keyboard_arrow_down</mat-icon>
                      </span>
                      <select class="discount-select"
                              (change)="updateElementExpenseDetail({checked: $any($event.target).value === 'percent'}, element.id, 'DiscountType')">
                        <option value="percent" [selected]="element.DiscountType === 'percent'">Percent</option>
                        <option value="amount" [selected]="element.DiscountType === 'amount'">Amount</option>
                      </select>
                    </div>
                  </span>
                  <span *ngSwitchDefault>
                    {{ element | rowDisplay:dc:columnTypeMap2[dc] }}
                  </span>
                </ng-container>
              </mat-cell>
            </ng-container>
          </ng-container>
            <ng-container matColumnDef="loading">
                <mat-footer-cell *matFooterCellDef colspan="6">
                    <mat-progress-bar color="primary" mode="indeterminate"></mat-progress-bar>
                </mat-footer-cell>
            </ng-container>
            <ng-container matColumnDef="noData">
                <mat-footer-cell *matFooterCellDef colspan="6">
                    No data.
                </mat-footer-cell>
            </ng-container>
            <mat-header-row *matHeaderRowDef="defaultColumns2; sticky:true"></mat-header-row>
            <mat-row  (click)="getRecord2(row)"  *matRowDef="let row; columns: defaultColumns2;" [ngClass]="{'data-selected': selectedId == row.id}"></mat-row>
            <mat-footer-row *matFooterRowDef="['loading']" [ngClass]="{'hide':!isLoading2}"></mat-footer-row>
            <mat-footer-row *matFooterRowDef="['noData']"[ngClass]="{'hide':!(listData2!=null && listData2.data.length==0)}"></mat-footer-row>
        </mat-table>
    </div>
  </div>
</div>

<div class="fixed-bottom-button-group">
  <div class="row g-2">
    <div class="col-12 col-md-4 mat-elevation-z2 left-panel">
      <mat-button-toggle-group style="width:100%;" color="primary">
        <mat-button-toggle style="width:100%" *ngFor="let tB of toggleButtons2" 
          [title]="tB.Label" [disabled]="!tB.Disabled" (click)="tB.Function()">
          {{tB.Label}}
        </mat-button-toggle>
      </mat-button-toggle-group>
    </div>
    <div class="col-12 col-md-8 mat-elevation-z2 right-panel">
      <div class="save-button">
        <mat-button-toggle-group style="width:100%;" color="primary">
          <mat-button-toggle style="width:100%" *ngFor="let tB of toggleButtons"
            [title]="tB.Label" [disabled]="!tB.Disabled" (click)="tB.Function()">
            {{tB.Label}}
          </mat-button-toggle>
        </mat-button-toggle-group>
      </div>
    </div>
  </div>
</div>



<div style="visibility: hidden; position: fixed"
    [style.left]="contextMenuPosition.x"
    [style.top]="contextMenuPosition.y"
    [matMenuTriggerFor]="contextMenu">
</div>
<mat-menu #contextMenu="matMenu">
	<ng-template matMenuContent let-data="data">
     <ng-container *ngIf="rightClickType === 'expensedetails'; else itemsRightClick">
            <button mat-menu-item *ngFor="let cB of contextButtons2" [disabled]="!cB.Disabled" (click)="cB.Function()">
                <mat-icon>read_more</mat-icon> {{ cB.Label }}
            </button>
        </ng-container> 
        <ng-template #itemsRightClick>
            <button mat-menu-item *ngFor="let cB of contextButtons1" [disabled]="!cB.Disabled" (click)="cB.Function()">
                <mat-icon>read_more</mat-icon> {{ cB.Label }}
            </button>
        </ng-template>

	</ng-template>
</mat-menu>

<button mat-icon-button class="close-button" [mat-dialog-close]="true">
    <mat-icon class="close-icon" color="warn">close</mat-icon>
</button>
<h2 mat-dialog-title>ExpenseDetailUI</h2>
<mat-divider></mat-divider>
<form [formGroup]="expenseDetailForm" (ngSubmit)="onSubmit()">
    <div mat-dialog-content>
        <div class="row">
            <mat-form-field class="" appearance="standard">
                <mat-label>ParticularName</mat-label>
                <input matInput placeholder="Input ParticularName" autocomplete="off" required formControlName="ParticularName" readonly>
            </mat-form-field>
        </div>
        <div class="row">
            <mat-form-field class="w-100"  appearance="standard">
                <mat-label>Amount</mat-label>
                <input #amountInput matInput placeholder="Input Amount"  type="text" mask="separator.2" thousandSeparator="," decimalMarker="." [dropSpecialCharacters]="true" [allowNegativeNumbers]="true" autocomplete="off" required formControlName="Amount" (keyup.enter)="onEnterQty()">
            </mat-form-field>
        </div>
        <div class="row">
            <div class="col-3">
             <mat-form-field class="w-100" appearance="standard">
                 <mat-label>Discount</mat-label>
                 <input matInput placeholder="Input Discount" type="text" mask="separator.2" thousandSeparator="," decimalMarker="." [dropSpecialCharacters]="true" [allowNegativeNumbers]="true"  autocomplete="off" required formControlName="Discount" readonly>
             </mat-form-field>
            </div> 
            <div class="col-3">
                 <mat-form-field class="w-00" appearance="standard">
                     <mat-label>DiscountValue</mat-label>
                     <input matInput placeholder="Input DiscountValue" type="text" mask="separator.2" thousandSeparator="," decimalMarker="." [dropSpecialCharacters]="true" [allowNegativeNumbers]="true"  autocomplete="off" required formControlName="DiscountValue"  (keyup.enter)="computeExpenseDetailAmount()">
                 </mat-form-field>
            </div> 
            <div class="col-6">
             <mat-form-field class="w-100" appearance="standard">
                 <mat-label>DiscountType</mat-label>
                 <mat-select role="combobox" [disableOptionCentering]="true" formControlName="DiscountType"  required (selectionChange)="computeExpenseDetailAmount()">
                     <mat-option value="percent">Percent</mat-option>
                     <mat-option value="amount">Amount</mat-option>
                 </mat-select>
             </mat-form-field>
            </div> 
         </div>
        <div class="row">
            <mat-form-field class="w-100"  appearance="standard">
                <mat-label>AmountDue</mat-label>
                <input matInput placeholder="Input AmountDue" autocomplete="off" required type="text" mask="separator.2" thousandSeparator="," decimalMarker="." [dropSpecialCharacters]="true" [allowNegativeNumbers]="true" formControlName="AmountDue" readonly>
            </mat-form-field>
        </div>
    </div>
    <div mat-dialog-actions [align]="'end'" class="mb-3">
        <button type="button"  (click)="onSubmit()" class="mt-4 me-2" mat-raised-button color="primary" [disabled]="expenseDetailForm.invalid || loading == true">{{btnText}}</button>
    </div>
  </form>

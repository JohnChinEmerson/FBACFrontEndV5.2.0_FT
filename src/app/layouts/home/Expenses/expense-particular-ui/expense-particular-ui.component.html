<button mat-icon-button class="close-button"  (click)="onClose()">
    <mat-icon class="close-icon" color="warn">close</mat-icon>
</button>
<h2 mat-dialog-title>ExpenseParticularUI</h2>
<mat-divider></mat-divider>
<form [formGroup]="particularForm" (ngSubmit)="onSubmit()">
    <div mat-dialog-content>
            <div class="row">
                <mat-form-field class="" appearance="standard">
                    <mat-label>ParticularName</mat-label>
                    <input matInput placeholder="Input ParticularName" autocomplete="off" required formControlName="ParticularName">
                </mat-form-field>
            </div>
            <div class="row">
                <mat-form-field class="w-100"  appearance="standard">
                    <mat-label>Amount</mat-label>
                    <input matInput placeholder="Input Amount" type="text" mask="separator.2" thousandSeparator="," decimalMarker="." [dropSpecialCharacters]="true" [allowNegativeNumbers]="true" autocomplete="off" required formControlName="Amount">
                </mat-form-field>
            </div>
         
            <div class="row">
                <div class="col align-elements">
                    <ng-select  
                        class="w-15" 
                        [items]="categorys" 
                        [virtualScroll]="true" 
                        appendTo="body" 
                        formControlName="Category" 
                        bindLabel="AccountTitle" 
                        bindValue="AccountTitle"  
                        [searchable]="true" 
                        [clearable] = "false" 
                        placeholder="Category" 
                        (change)="onChangeCategory($event)"
                        required>
                    </ng-select>
                    <button type="button"  (click)="onClickCategory()"mat-icon-button color="primary"> <mat-icon>add_circle</mat-icon></button>
                </div>
            </div>
        </div>
        <div mat-dialog-actions [align]="'end'" class="mb-3">
            <button type="submit" class="mt-4 me-2" mat-raised-button color="primary" [disabled]="particularForm.invalid || loading == true">{{btnText}}</button>
        </div>
  </form>

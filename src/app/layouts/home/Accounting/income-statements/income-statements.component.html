<section class="content">
    <div class="search-div">
      <ng-select 
          [items]="branches" 
          [virtualScroll]="true" 
          appendTo="body" 
          bindLabel="BranchName"
          bindValue="BranchId"
          [(ngModel)]="branchId" 
          [searchable]="true" 
          [clearable] = "false" 
          placeholder="Branch"
          class="w-10"
          >
      </ng-select>
        <mat-form-field appearance="standard">
            <mat-label>Date From</mat-label>
            <input matInput [matDatepicker]="picker" [(ngModel)]="dateFrom"  autocomplete="off" required >
            <mat-datepicker-toggle matSuffix [for]="picker"></mat-datepicker-toggle>
            <mat-datepicker #picker></mat-datepicker>
        </mat-form-field>
        <mat-form-field appearance="standard">
            <mat-label>Date To</mat-label>
            <input matInput [matDatepicker]="picker2" [(ngModel)]="dateTo"  autocomplete="off"  required>
            <mat-datepicker-toggle matSuffix [for]="picker2"></mat-datepicker-toggle>
            <mat-datepicker #picker2></mat-datepicker>
        </mat-form-field>
        <button mat-raised-button color="primary" *ngFor="let tB of toolButtons" [disabled]="!tB.Disabled" (click)="tB.Function()" >{{tB.Label}}</button> 
       
    </div>
    <div class="mat-elevation-z2">
      <div class="w-50" *ngIf="loaded" id="toprint"> 
          <div class="mb-5">
              <table class="w-100 table table-bordered">
                <thead class="thead-background">
                  <tr>
                    <th scope="col">ACCOUNT TITLE</th>
                    <th scope="col">PREVIOUS AMOUNT</th>
                    <th scope="col">AMOUNT</th>
                    <th scope="col">ENDING AMOUNT</th>
                  </tr>
                </thead>
                <tbody>
                  <tr *ngFor="let row of incomeStatements" (dblclick)="onDBLClick(row)"   (click)="getRecord(row, false)" [ngClass]="{'data-selected': selectedAccountTitle === row.AccountTitle, 'clickable': selectedAccountTitle === row.AccountTitle}">
                      <ng-container *ngIf="row.Type == 'Header'">
                      <td class="category-header">{{ row.AccountTitle }}</td>
                      <td class="numeric category-header">{{ row.PreviousAmount }}</td>
                      <td class="numeric category-header">{{ row.Amount }}</td>
                      <td class="numeric category-header">{{ row.EndingAmount }}</td>
                      </ng-container>

                      <ng-container *ngIf="!row.Type " >
                          <td class="detail">{{ row.AccountTitle }}</td>
                          <td class="numeric">{{ row.PreviousAmount }}</td>
                          <td class="numeric">{{ row.Amount }}</td>
                          <td class="numeric">{{ row.EndingAmount }}</td>
                        </ng-container>

                      <ng-container *ngIf="row.Type == 'Empty'">
                        <td  colspan="4" class="empty-row"></td>
                      </ng-container>

                    </tr>
                </tbody>
              </table>
          </div>
      </div>
    </div>
  
</section>

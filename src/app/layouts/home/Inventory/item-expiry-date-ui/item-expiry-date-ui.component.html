<button mat-icon-button class="close-button" [mat-dialog-close]="true">
    <mat-icon class="close-icon" color="warn">close</mat-icon>
</button>
<h2 mat-dialog-title>ItemExpiryDateUI</h2>
<mat-divider></mat-divider>
<form [formGroup]="expiryDateForm" (ngSubmit)="onSubmit()">
    <div mat-dialog-content>
        <div class="row">
            <mat-form-field class="w-100" appearance="standard">
                <mat-label> ExpiryDate</mat-label>
                <input matInput [matDatepicker]="picker" formControlName="ExpiryDate2"  autocomplete="off">
                <mat-datepicker-toggle matSuffix [for]="picker"></mat-datepicker-toggle>
                <mat-datepicker #picker></mat-datepicker>
            </mat-form-field>
        </div>
        <div class="row">
            <mat-form-field  class="w-100" appearance="standard">
                <mat-label>BatchLotNo</mat-label>
                <input class="BatchLotNo" matInput placeholder="Input BatchLotNo"  autocomplete="off" required formControlName="BatchLotNo">
            </mat-form-field>
        </div>
        <div class="row">
            <mat-form-field class="w-100"  appearance="standard">
                <mat-label>Qty</mat-label>
                <input matInput placeholder="Input Qty" type="text" mask="separator.2" thousandSeparator="," decimalMarker="." [dropSpecialCharacters]="true" [allowNegativeNumbers]="true" autocomplete="off" required formControlName="Qty" >
            </mat-form-field>
        </div>
        
    </div>
    <div mat-dialog-actions [align]="'end'" class="mb-3">
        <button type="button"  (click)="onSubmit()" class="mt-4 me-2" mat-raised-button color="primary" [disabled]="expiryDateForm.invalid || loading == true">{{btnText}}</button>
    </div>
  </form>

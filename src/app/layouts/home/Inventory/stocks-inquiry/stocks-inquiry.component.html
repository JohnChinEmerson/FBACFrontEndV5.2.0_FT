<mat-tab-group (selectedTabChange)="DisplayTab($event.tab.textLabel)" [selectedIndex]="null">
    <mat-tab  *ngFor="let b of Branches" [label]="b.BranchName">
      <div class="tab-content">
      </div>
    </mat-tab>
  </mat-tab-group>
<section class="content">
        <div class="search-div">
            <mat-form-field class="w-20" floatLabel="never" appearance="standard">
                <input matInput placeholder="Search" [(ngModel)]="searchKey" (keyup)="applyFilter()" autocomplete="false">
                <button mat-button matSuffix mat-icon-button aria-label="Clear" (click)="clearSearch()">
                    <mat-icon>close</mat-icon>
                </button>
            </mat-form-field>
            <button mat-raised-button color="accent" (click)="onClickPrint()" ><mat-icon>print</mat-icon> Print</button>

        </div>
        <div class="mat-elevation-z1 table-cont-pop-up w-100">
            <mat-table [dataSource]="listData" matSort>
              <ng-container *ngFor="let branch of Branches" [matColumnDef]="branch.BranchName">
                <mat-header-cell *matHeaderCellDef mat-sort-header>{{branch.BranchName}}</mat-header-cell>
                <mat-cell *matCellDef="let element" [ngClass]="element | rowClasses:branch.BranchName:'decimal'">{{element[branch.BranchName] | number:'1.2-2'}}</mat-cell>
              </ng-container>
               <ng-container *ngFor="let dc of displayedColumns">
                  <ng-container  [matColumnDef]="dc">
                  <mat-header-cell *matHeaderCellDef sticky>{{ dc }}</mat-header-cell>
                      <mat-cell  *matCellDef="let element"  class="auto-adjust-cell" [ngClass]="element | rowClasses:dc:columnTypeMap[dc]" [title]="element[dc]">
                      <span>{{ element | rowDisplay:dc:columnTypeMap[dc] }}</span>
                      </mat-cell>
                  </ng-container>
              </ng-container>
                
                <ng-container matColumnDef="Total" sticky>
                    <mat-header-cell *matHeaderCellDef mat-sort-header>Total</mat-header-cell>
                    <mat-cell *matCellDef="let element" [ngClass]="element | rowClasses:'Total':'decimal'">{{ element | rowTotal:Branches | number:'1.2-2' }}</mat-cell>
                  </ng-container>
                <ng-container matColumnDef="loading">
                  <mat-footer-cell *matFooterCellDef colspan="6">
                    <mat-progress-bar color="primary" mode="indeterminate"></mat-progress-bar>
                  </mat-footer-cell>
                </ng-container>
                <ng-container matColumnDef="noData">
                  <mat-footer-cell *matFooterCellDef colspan="6">
                    No data.
                  </mat-footer-cell>
                </ng-container>
              
               <mat-header-row *matHeaderRowDef="displayedColumnsComputed; sticky:true"></mat-header-row>
                <mat-row *matRowDef="let row; columns: displayedColumnsComputed;"></mat-row>
                <mat-footer-row *matFooterRowDef="['loading']" [ngClass]="{'hide':!IsTrue}"></mat-footer-row>
                <mat-footer-row *matFooterRowDef="['noData']" [ngClass]="{'hide':!(listData!=null && listData.data.length==0)}"></mat-footer-row>
              </mat-table>
              
            <mat-paginator class="mat-paginator-sticky" [pageSize]="20" [pageSizeOptions]="pageSizeOptions" showFirstLastButtons> </mat-paginator>
        </div>
</section>

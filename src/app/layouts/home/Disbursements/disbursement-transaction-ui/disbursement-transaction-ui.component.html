
<button mat-icon-button class="close-button" (click)="onClose()">
    <mat-icon class="close-icon" color="warn">close</mat-icon>
</button>
<h2 mat-dialog-title>DisbursementTransactionUI</h2>
<mat-divider></mat-divider>
<form [formGroup]="disbursmentTransForm" (ngSubmit)="onSubmit()">
    <div mat-dialog-content>
        <div class="row">
            <div class="col-6">
                <mat-form-field class="" appearance="standard">
                    <mat-label>TransName</mat-label>
                    <input matInput placeholder="Input TransName" autocomplete="off" required formControlName="TransName" readonly>
                </mat-form-field>
            </div>
            <div class="col-6">
                <mat-form-field class="" appearance="standard">
                    <mat-label>TransNo</mat-label>
                    <input matInput placeholder="Input TransNo" autocomplete="off" required formControlName="TransNo" readonly>
                </mat-form-field>
            </div>
        </div>
        <div class="row">
            <div class="col-6">
                <mat-form-field appearance="standard">
                    <mat-label>TransDate</mat-label>
                    <input matInput [matDatepicker]="picker" formControlName="TransDate"  autocomplete="off" required>
                    <mat-datepicker-toggle matSuffix [for]="picker"></mat-datepicker-toggle>
                    <mat-datepicker #picker></mat-datepicker>
                </mat-form-field>
            </div>
            <div class="col-3">
                    <mat-form-field class="" appearance="standard">
                        <mat-label>VoucherNo</mat-label>
                        <input matInput placeholder="Input VoucherNo" autocomplete="off" required formControlName="VoucherNo" >
                    </mat-form-field>
            </div>
            <div class="col-3">
                <mat-form-field class="" appearance="standard">
                    <mat-label>InvNo</mat-label>
                    <input matInput placeholder="Input InvNo" autocomplete="off"  formControlName="InvNo" >
                </mat-form-field>
        </div>
        </div>
        <div class="row">
            <mat-form-field class="" appearance="standard">
                <mat-label>PayTo</mat-label>
                <input matInput placeholder="Input PayToName" autocomplete="off" required formControlName="PayToName" readonly>
            </mat-form-field>

           
        </div>
        <div class="row">
            <mat-form-field class="w-100" appearance="standard">
                <mat-label>PaymentType</mat-label>
                <mat-select role="combobox" [disableOptionCentering]="true" formControlName="PaymentType" required (selectionChange)="onChangePaymentType($event.value)">
                    <mat-option *ngFor="let x of paymentTypes" [value]="x"> {{x}} </mat-option>
                </mat-select>
            </mat-form-field>
        </div>
        <div class="row">
            <mat-form-field class="" appearance="standard">
                <mat-label>AmountPaid</mat-label>
                <input matInput placeholder="Input AmountPaid" type="text" mask="separator.2" thousandSeparator="," decimalMarker="." [dropSpecialCharacters]="true" [allowNegativeNumbers]="true" autocomplete="off" required formControlName="AmountPaid" >
            </mat-form-field>
        </div>
        <div class="row">
            <mat-form-field class="w-100" appearance="standard">
                <mat-label>CashAccount</mat-label>
                <mat-select role="combobox" [disableOptionCentering]="true" formControlName="CashAccount" autocomplete="off" required (selectionChange)="onChangeCashAccount()">
                    <mat-option  *ngFor="let x of cashAccounts" [value]="x.CashAccount"> {{x.CashAccount}} </mat-option>
                </mat-select>
            </mat-form-field>
        </div>
        <div class="row">
            <mat-form-field appearance="standard" class="w-100">
                <mat-label>CheckDate</mat-label>
                <input matInput [matDatepicker]="picker3" formControlName="CheckDate" autocomplete="off"  [required]="requiredCheck"  >
                <mat-datepicker-toggle matSuffix [for]="picker3"></mat-datepicker-toggle>
                <mat-datepicker #picker3></mat-datepicker>
            </mat-form-field>
        </div>
       <div class="row">
    <div class="col-4">
        <mat-form-field class="w-100" appearance="standard">
            <mat-label>CheckNo</mat-label>
            <input
                matInput
                placeholder="Input CheckNo"
                autocomplete="off"
                formControlName="CheckNo"
                [required]="requiredCheck">
        </mat-form-field>
    </div>

    <div class="col-4">
        <ng-select
            [items]="checkbooklets"
            [virtualScroll]="true"
            appendTo="body"
            formControlName="CheckBookLet"
            bindLabel="Detail"
            bindValue="TransNo"
            [searchable]="true"
            [clearable]="false"
            placeholder="CheckBookLet"
            (change)="onChangeCheckBookLet($event)"
            required>
        </ng-select>
    </div>

    <div class="col-4">
        <button
            type="button"
            (click)="onClickSelectCheck()"
            mat-flat-button
            color="primary"
            class="w-100 mt-3"
            [disabled]="!selectCheck">
            Select Check
        </button>
    </div>
</div>
      
        <div class="row">
            <mat-form-field class="" appearance="standard">
                <mat-label>Description</mat-label>
                <textarea matInput placeholder="Input Description" autocomplete="off" required formControlName="Description" ></textarea>
            </mat-form-field>
        </div>
        <div class="row">
            <div class="col align-elements">
                <ng-select  
                    class="w-15" 
                    [items]="employees" 
                    [virtualScroll]="true" 
                    appendTo="body" 
                    formControlName="ReceivedById" 
                    bindLabel="EmpName" 
                    bindValue="EmpId"  
                    [searchable]="true" 
                    [clearable] = "false" 
                    placeholder="ReceivedBy" 
                    (change)="onChangeReceivedById($event)"
                    required>
                </ng-select>
                <button type="button"  (click)="onClickEmployees()"mat-icon-button color="primary"> <mat-icon>list</mat-icon></button>
            </div>
        </div>
        
    </div>
    <div mat-dialog-actions [align]="'end'" class="mb-3">
        <button type="button"    mat-button color="primary" class="me-3" >
            <mat-checkbox  [checked]="printReceipt"  (change)="onChangePrintReceipt($event.checked)" [disabled]="disablePrintReceipt">
                <mat-label>Print Receipt</mat-label>
            </mat-checkbox>
        </button>
        <button type="button"    mat-button color="primary" class="me-3" (click)="onClickSignatures()">
                <mat-label>Signatures</mat-label>
        </button>
    <button type="submit" class="mt-4 me-2" mat-raised-button color="primary" [disabled]="disbursmentTransForm.invalid || loading == true">{{btnText}}</button>
    </div>
</form>

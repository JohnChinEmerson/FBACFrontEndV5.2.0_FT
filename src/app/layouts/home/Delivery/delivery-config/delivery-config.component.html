<app-background-logo-ui></app-background-logo-ui>

<div class="content">
    <mat-card>
        <button mat-icon-button class="close-button" (click)="onClose()" aria-label="Close dialog">
            <mat-icon class="close-icon" color="warn">close</mat-icon>
        </button>
        <h2 mat-dialog-title>DeliveryConfigUI</h2>
        <mat-divider></mat-divider>

        <form [formGroup]="deliveryConfigForm" (ngSubmit)="onSubmit()">
            <div mat-dialog-content>

                <div class="field-row">
                    <mat-checkbox
                        [checked]="deliveryConfig.DisableTransDate == 'yes'"
                        (change)="onCheck('DisableTransDate', $event.checked, deliveryConfig.DisableTransDate, 'Boolean')">
                        Disable Trans Date
                    </mat-checkbox>
                    <mat-form-field appearance="outline" class="dense-field">
                        <input
                            matInput
                            placeholder="Input DisableTransDate"
                            autocomplete="off"
                            formControlName="DisableTransDate">
                    </mat-form-field>
                </div>

                <div class="field-row">
                    <mat-checkbox
                        [checked]="deliveryConfig.ReceiptLabel != null"
                        (change)="onCheck('ReceiptLabel', $event.checked, deliveryConfig.ReceiptLabel, 'String')">
                        Receipt Label
                    </mat-checkbox>
                    <mat-form-field appearance="outline" class="dense-field">
                        <input
                            matInput
                            placeholder="Input ReceiptLabel"
                            autocomplete="off"
                            formControlName="ReceiptLabel">
                    </mat-form-field>
                </div>

                <div class="field-row align-top">
                    <mat-checkbox
                        [checked]="deliveryConfig.ReceiptNotes != null"
                        (change)="onCheck('ReceiptNotes', $event.checked, deliveryConfig.ReceiptNotes, 'String')">
                        Receipt Notes
                    </mat-checkbox>
                    <mat-form-field appearance="outline" class="dense-field">
                        <textarea
                            matInput
                            placeholder="Input ReceiptNotes"
                            rows="3"
                            autocomplete="off"
                            formControlName="ReceiptNotes"></textarea>
                    </mat-form-field>
                </div>

            </div>

            <div mat-dialog-actions [align]="'end'" class="mb-3">
                <button
                    type="submit"
                    class="mt-4 me-2"
                    mat-raised-button
                    color="primary"
                    [disabled]="deliveryConfigForm.invalid || loading == true">
                    {{btnText}}
                </button>
            </div>
        </form>
    </mat-card>
</div>

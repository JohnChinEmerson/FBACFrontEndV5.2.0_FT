<button mat-icon-button class="close-button" (click)="onClose()">
    <mat-icon class="close-icon" color="warn">close</mat-icon>
</button>
<h2 mat-dialog-title>DeliveryDetailUI</h2>
<mat-divider></mat-divider>
<form [formGroup]="deliveryDetailForm" (ngSubmit)="onSubmit()">
    <div mat-dialog-content>
        <div class="row">
            <mat-form-field class="" appearance="standard">
                <mat-label>ItemName</mat-label>
                <input matInput placeholder="Input ItemName" autocomplete="off" required formControlName="ItemName" readonly>
            </mat-form-field>
        </div>
        <div class="row">
            <mat-form-field class="w-100"  appearance="standard">
                <mat-label>UM</mat-label>
                <input matInput placeholder="Input UM" autocomplete="off" required formControlName="UM" readonly>
            </mat-form-field>
        </div>
        <div class="row">
            <div class="col align-elements">
                <mat-form-field class="w-40"  appearance="standard">
                    <mat-label>Price</mat-label>
                    <input matInput placeholder="Input Price" autocomplete="off" required formControlName="Price" type="text" mask="separator.2" thousandSeparator="," decimalMarker="." [dropSpecialCharacters]="true" [allowNegativeNumbers]="true"  (keyup.enter)="computeDeliveryDetailAmount()" readonly>
                </mat-form-field>
                <mat-form-field class="w-40"  appearance="standard">
                    <mat-label>PriceCategory</mat-label>
                    <input matInput placeholder="Input PriceCategory" autocomplete="off" required formControlName="PriceCategory" readonly>
                </mat-form-field>
                <button type="button" (click)="onClickOtherPriceCategories()"  mat-icon-button color="primary" title="Other Price Categorys" disabled="true"><mat-icon>list</mat-icon></button>
            </div>
        </div>
        <div class="row">
            <mat-form-field class="w-100"  appearance="standard">
                <mat-label>Qty</mat-label>
                <input #qtyInput matInput placeholder="Input Qty" autocomplete="off" required formControlName="Qty" type="text" mask="separator.2" thousandSeparator="," decimalMarker="." [dropSpecialCharacters]="true" [allowNegativeNumbers]="true" (keyup.enter)="onEnterQty()">
            </mat-form-field>
        </div>
        <div class="row">
           <div class="col-3">
            <mat-form-field class="" appearance="standard">
                <mat-label>Discount</mat-label>
                <input matInput placeholder="Input Discount" type="text" mask="separator.2" thousandSeparator="," decimalMarker="." [dropSpecialCharacters]="true" [allowNegativeNumbers]="true"  autocomplete="off" required formControlName="Discount" readonly>
            </mat-form-field>
           </div> 
           <div class="col-3">
                <mat-form-field class="" appearance="standard">
                    <mat-label>DiscountValue</mat-label>
                    <input matInput placeholder="Input DiscountValue" type="text" mask="separator.2" thousandSeparator="," decimalMarker="." [dropSpecialCharacters]="true" [allowNegativeNumbers]="true"  autocomplete="off" required formControlName="DiscountValue"  (keyup.enter)="computeDeliveryDetailAmount()" readonly>
                </mat-form-field>
           </div> 
           <div class="col-6">
            <mat-form-field class="w-100" appearance="standard">
                <mat-label>DiscountType</mat-label>
                <mat-select role="combobox" [disableOptionCentering]="true" formControlName="DiscountType" (selectionChange)="computeDeliveryDetailAmount()" >
                    <mat-option value="percent">Percent</mat-option>
                    <mat-option value="amount">Amount</mat-option>
                </mat-select>
            </mat-form-field>
           </div> 
        </div>
        <div class="row">
            <mat-form-field class="w-100"  appearance="standard">
                <mat-label>Amount</mat-label>
                <input matInput placeholder="Input Amount" autocomplete="off" required type="text" mask="separator.2" thousandSeparator="," decimalMarker="." [dropSpecialCharacters]="true" [allowNegativeNumbers]="true" formControlName="Amount" readonly>
            </mat-form-field>
        </div>
        <div class="row">
            <div class="col-6">
                <mat-form-field appearance="standard">
                    <mat-label>ExpiryDate</mat-label>
                    <input matInput placeholder="Input ExpiryDate" autocomplete="off" required formControlName="ExpiryDate" readonly>
                </mat-form-field>
            </div>
            <div class="col-6">
                <mat-form-field appearance="standard">
                    <mat-label>BatchLotNo</mat-label>
                    <input matInput placeholder="Input BatchLotNo" autocomplete="off" required formControlName="BatchLotNo" readonly>
                </mat-form-field>
            </div>
        </div>
    </div>
    <div mat-dialog-actions [align]="'end'" class="mb-3">
        <button type="button"  (click)="onSubmit()" class="mt-4 me-2" mat-raised-button color="primary" [disabled]="deliveryDetailForm.invalid || loading == true">{{btnText}}</button>
    </div>
  </form>

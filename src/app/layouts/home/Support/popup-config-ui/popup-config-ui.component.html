<button mat-icon-button class="close-button"  (click)="onClose()">
    <mat-icon class="close-icon" color="warn">close</mat-icon>
</button>
<h2 mat-dialog-title>PopUpUI</h2>
<mat-divider></mat-divider>
<form [formGroup]="popupForm" (ngSubmit)="onSubmit()">
    <div mat-dialog-content>
            <div class="row">
                <mat-form-field class="" appearance="standard">
                    <mat-label>PopUp</mat-label>
                    <input matInput placeholder="Input PopUp" autocomplete="off" required formControlName="PopUp" readonly>
                </mat-form-field>
            </div>
            <div class="row">
                <mat-form-field class="w-100"  appearance="standard">
                    <mat-label>OnOrBeforeDays</mat-label>
                    <input matInput placeholder="Input OnOrBeforeDays" type="text" mask="separator.2" thousandSeparator="," decimalMarker="." [dropSpecialCharacters]="true" [allowNegativeNumbers]="true" autocomplete="off" required formControlName="OnOrBeforeDays" >
                </mat-form-field>
            </div>
        </div>
        <div mat-dialog-actions [align]="'end'" class="mb-3">
            <button type="submit" class="mt-4 me-2" mat-raised-button color="primary" [disabled]="popupForm.invalid || loading == true">{{btnText}}</button>
        </div>
  </form>

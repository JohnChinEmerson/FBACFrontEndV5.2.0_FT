     <app-background-logo-ui></app-background-logo-ui>

<div class="content">
    <mat-card>
        <button mat-icon-button class="close-button" (click)="onClose()">
            <mat-icon class="close-icon" color="warn">close</mat-icon>
        </button>
        <h2 mat-dialog-title>ContactSupportUI</h2>
        <mat-divider></mat-divider>
            <form [formGroup]="contactSupportForm" (ngSubmit)="onSubmit()">
                <div mat-dialog-content>
                    <div class="row">
                        <mat-form-field class="w-100" appearance="standard">
                            <mat-label>Software</mat-label>
                            <input matInput placeholder="Input Software" autocomplete="off" required formControlName="SoftwareType" readonly>
                        </mat-form-field>
                    </div>
                    <div class="row">
                        <div class="col align-elements">
                            <mat-form-field class="w-100" appearance="standard">
                                <mat-label>TechSupport</mat-label>
                                <mat-select role="combobox" [disableOptionCentering]="true" formControlName="EmployeeNo" required >
                                    <mat-option  value="ordinary" *ngFor="let x of techSupports" [value]="x.EmployeeNo"> {{x.EmployeeName}} </mat-option>
                                </mat-select>
                            </mat-form-field>
                            <button type="button" (click)="onClickLoadTechSupport()"  mat-flat-button color="primary" class="w-50" [disabled]="btnTechSupportDisable"> {{btnTechSupportText}}</button>
                        </div>
                    </div>
                    <div class="row">
                        <mat-form-field class="w-100" appearance="standard">
                            <mat-label>Concerns</mat-label>
                            <textarea  matInput placeholder="Input Concerns" rows="5" autocomplete="off" required formControlName="Description" ></textarea>
                        </mat-form-field>
                    </div>
                </div>
                <div mat-dialog-actions [align]="'end'" class="mb-3">
                <button type="submit" class="mt-4 me-2" mat-raised-button color="primary" [disabled]="contactSupportForm.invalid || loading == true">{{btnText}}</button>
                </div>
            </form>
    </mat-card>
</div>

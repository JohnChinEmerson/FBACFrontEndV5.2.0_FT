     <app-background-logo-ui></app-background-logo-ui>

<div class="content">
    <mat-card>
        <button mat-icon-button class="close-button" (click)="onClose()">
            <mat-icon class="close-icon" color="warn">close</mat-icon>
        </button>
        <h2 mat-dialog-title>PopupAccessRightsUI</h2>
        <mat-divider></mat-divider>
        <div class="mat-elevation-z2 table-cont-pop-up">
            <div class="row g-2">
                <div class="col-6">
                    <div class="search-div ">
                        <!-- <mat-form-field floatLabel="never"  appearance="standard">
                            <input matInput [(ngModel)]="searchKey" placeholder="Search" (keyup)="applyFilter()" autocomplete="false">
                            <button mat-button matSuffix mat-icon-button aria-label="Clear" (click)="clearSearch()">
                            <mat-icon>close</mat-icon>
                            </button>
                        </mat-form-field> -->
                        <ng-select 
                            [items]="popups" 
                            [virtualScroll]="true" 
                            appendTo="body" 
                            bindLabel="PopUp"
                            bindValue="id"
                            [(ngModel)]="popupId" 
                            [searchable]="true" 
                            [clearable] = "false" 
                            placeholder="Popup"
                            class="w-30"
                            (change)="getPopUpAccessRights()"
                            >
                        </ng-select>
                        <button mat-raised-button color="primary" *ngFor="let tB of toolButtons" [disabled]="!tB.Disabled" (click)="tB.Function()" >{{tB.Label}}</button> 
                    </div>
                    <mat-table [dataSource]="listData" matSort>
                        <ng-container *ngFor="let dc of addedColumns" [matColumnDef]="dc">
                            <mat-header-cell *matHeaderCellDef mat-sort-header></mat-header-cell>
                            <mat-cell *matCellDef="let element"  class="mat-column-number">
                                <mat-checkbox (change)="onCheckToSave(element, $event.checked)"></mat-checkbox>
                            </mat-cell>
                        </ng-container>
                        <ng-container *ngFor="let dc of defaultColumns" [matColumnDef]="dc">
                            <mat-header-cell *matHeaderCellDef mat-sort-header>{{dc}}</mat-header-cell>
                            <mat-cell *matCellDef="let element">{{element[dc]}}</mat-cell>
                        </ng-container>
                        <ng-container matColumnDef="loading">
                            <mat-footer-cell *matFooterCellDef colspan="6">
                                <mat-progress-bar color="primary" mode="indeterminate"></mat-progress-bar>
                            </mat-footer-cell>
                        </ng-container>
                        <ng-container matColumnDef="noData">
                            <mat-footer-cell *matFooterCellDef colspan="6">
                                No data.
                            </mat-footer-cell>
                        </ng-container>
                        <mat-header-row *matHeaderRowDef="mergeColumns; sticky:true"></mat-header-row>
                        <mat-row  (click)="getRecord(row)"  *matRowDef="let row; columns: mergeColumns;" [ngClass]="{'data-selected': selectedId == row.id}" ></mat-row>
                        <mat-footer-row *matFooterRowDef="['loading']" [ngClass]="{'hide':!isLoading}"></mat-footer-row>
                        <mat-footer-row *matFooterRowDef="['noData']" [ngClass]="{'hide':!(listData!=null && listData.data.length==0)}"></mat-footer-row>
                    </mat-table>
                  <mat-paginator #paginator class="mat-paginator-sticky" [pageSize]="20" [pageSizeOptions]="pageSizeOptions" showFirstLastButtons> </mat-paginator>
                </div>
                <div class="col-6">
                    <div class="search-div">
                        <mat-form-field floatLabel="never"  appearance="standard">
                            <input matInput [(ngModel)]="searchKey2" placeholder="Search" (keyup)="applyFilter2()" autocomplete="false">
                            <button mat-button matSuffix mat-icon-button aria-label="Clear" (click)="clearSearch2()">
                            <mat-icon>close</mat-icon>
                            </button>
                        </mat-form-field>
                        <button mat-raised-button color="primary" *ngFor="let tB of toolButtons2" [disabled]="!tB.Disabled" (click)="tB.Function()" >{{tB.Label}}</button> 
                    </div>
                    <mat-table [dataSource]="listData2" matSort>
                        <ng-container *ngFor="let dc of addedColumns" [matColumnDef]="dc">
                            <mat-header-cell *matHeaderCellDef mat-sort-header></mat-header-cell>
                            <mat-cell *matCellDef="let element"  class="mat-column-number">
                                <mat-checkbox (change)="onCheckToRemove(element, $event.checked)"></mat-checkbox>
                            </mat-cell>
                        </ng-container>
                        <ng-container *ngFor="let dc of defaultColumns" [matColumnDef]="dc">
                            <mat-header-cell *matHeaderCellDef mat-sort-header>{{dc}}</mat-header-cell>
                            <mat-cell *matCellDef="let element">{{element[dc]}}</mat-cell>
                        </ng-container>
                        <ng-container matColumnDef="loading">
                            <mat-footer-cell *matFooterCellDef colspan="6">
                                <mat-progress-bar color="primary" mode="indeterminate"></mat-progress-bar>
                            </mat-footer-cell>
                        </ng-container>
                        <ng-container matColumnDef="noData">
                            <mat-footer-cell *matFooterCellDef colspan="6">
                                No data.
                            </mat-footer-cell>
                        </ng-container>
                        <mat-header-row *matHeaderRowDef="mergeColumns; sticky:true"></mat-header-row>
                        <mat-row  (click)="getRecord2(row)"  *matRowDef="let row; columns: mergeColumns;" [ngClass]="{'data-selected': selectedId == row.id}" ></mat-row>
                        <mat-footer-row *matFooterRowDef="['loading']" [ngClass]="{'hide':!isLoading2}"></mat-footer-row>
                        <mat-footer-row *matFooterRowDef="['noData']" [ngClass]="{'hide':!(listData2!=null && listData2.data.length==0)}"></mat-footer-row>
                    </mat-table>
                  <mat-paginator  #paginator2  class="mat-paginator-sticky" [pageSize]="20" [pageSizeOptions]="pageSizeOptions2" showFirstLastButtons> </mat-paginator>
                </div>
            </div>
          
        </div>
    </mat-card>
</div>

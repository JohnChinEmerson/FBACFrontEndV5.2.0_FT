<section class="content">
    <div class="search-div">
        <mat-checkbox [checked]="withDate" [(ngModel)]="withDate"></mat-checkbox>
        <mat-form-field appearance="standard">
            <mat-label>Date From</mat-label>
            <input matInput [matDatepicker]="picker" [(ngModel)]="dateFrom"  autocomplete="off" required  [disabled]="!withDate">
            <mat-datepicker-toggle matSuffix [for]="picker"></mat-datepicker-toggle>
            <mat-datepicker #picker></mat-datepicker>
        </mat-form-field>
        <mat-form-field appearance="standard">
            <mat-label>Date To</mat-label>
            <input matInput [matDatepicker]="picker2" [(ngModel)]="dateTo"  autocomplete="off"  required  [disabled]="!withDate">
            <mat-datepicker-toggle matSuffix [for]="picker2"></mat-datepicker-toggle>
            <mat-datepicker #picker2></mat-datepicker>
        </mat-form-field>
      
        <ng-select  
            class="w-20"
            [items]="items" 
            [virtualScroll]="true" 
            appendTo="body" 
            bindLabel="ItemName"
            bindValue="ItemId"
            [searchable]="true" 
            [clearable] = "false" 
            placeholder="ItemName"
            [(ngModel)]="itemName"
            required>
        </ng-select>
      
        <ng-select  
            class="w-10"
            [items]="filterTypes" 
            [virtualScroll]="true" 
            appendTo="body" 
            [searchable]="true" 
            [clearable] = "false" 
            placeholder="FilterType"
            [(ngModel)]="filterType"
            required>
        </ng-select>
        <ng-select 
            [items]="branches" 
            [virtualScroll]="true" 
            appendTo="body" 
            bindLabel="BranchName"
            bindValue="BranchId"
            [(ngModel)]="branchId" 
            [searchable]="true" 
            [clearable] = "false" 
            placeholder="Branch"
            class="w-10"
            >
        </ng-select>
        <button mat-raised-button color="primary" *ngFor="let tB of toolButtons" [disabled]="!tB.Disabled" (click)="tB.Function()" >{{tB.Label}}</button> 
    </div>
    <mat-tab-group (selectedTabChange)="displayTab($event.tab.textLabel)" [selectedIndex]="null">
        <mat-tab label="Customers">
            <div class="tab-content">
                <app-item-customers-report  [filteredData]="filteredData"></app-item-customers-report>
            </div>
        </mat-tab>
        <mat-tab label="Suppliers">
            <div class="tab-content">
                <app-item-suppliers-report  [filteredData]="filteredData"></app-item-suppliers-report>
            </div>
        </mat-tab>
        <mat-tab label="Adjustment-StockIn">
            <div class="tab-content">
                <app-item-adjustments-report  [filteredData]="filteredData" adjustmentType="stockin"></app-item-adjustments-report>
            </div>
        </mat-tab>
        <mat-tab label="Adjustment-StockOut">
            <div class="tab-content">
                <app-item-adjustments-report  [filteredData]="filteredData" adjustmentType="stockout"></app-item-adjustments-report>
            </div>
        </mat-tab>
        <mat-tab label="Sales Return">
            <div class="tab-content">
                <app-item-sale-returns-report  [filteredData]="filteredData"></app-item-sale-returns-report>
            </div>
        </mat-tab>
        <mat-tab label="Return To Supplier">
            <div class="tab-content">
                <app-item-return-to-suppliers-report  [filteredData]="filteredData"></app-item-return-to-suppliers-report>
            </div>
        </mat-tab>
        <mat-tab label="Price History">
            <div class="tab-content">
                <app-item-price-history  [filteredData]="filteredData"></app-item-price-history>
            </div>
        </mat-tab>
        <mat-tab label="Cost History">
            <div class="tab-content">
                <app-item-cost-history  [filteredData]="filteredData"></app-item-cost-history>
            </div>
        </mat-tab>
    </mat-tab-group>
</section>

<div style="visibility: hidden; position: fixed"
    [style.left]="contextMenuPosition.x"
    [style.top]="contextMenuPosition.y"
    [matMenuTriggerFor]="contextMenu">
</div>
<mat-menu #contextMenu="matMenu">
	<ng-template matMenuContent let-data="data">
        <button mat-menu-item *ngFor="let cB of contextButtons" [disabled]="!cB.Disabled" (click)="cB.Function()" >
            <mat-icon>read_more</mat-icon> {{cB.Label}}
        </button>
    </ng-template>
</mat-menu>

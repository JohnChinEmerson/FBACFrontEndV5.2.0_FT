<section class="content">
    <div class="search-div">
        <mat-checkbox [checked]="withDate" [(ngModel)]="withDate"></mat-checkbox>
        <mat-form-field appearance="standard">
            <mat-label>Date From</mat-label>
            <input matInput [matDatepicker]="picker" [(ngModel)]="dateFrom"  autocomplete="off" required  [disabled]="!withDate">
            <mat-datepicker-toggle matSuffix [for]="picker"></mat-datepicker-toggle>
            <mat-datepicker #picker></mat-datepicker>
        </mat-form-field>
        <mat-form-field appearance="standard">
            <mat-label>Date To</mat-label>
            <input matInput [matDatepicker]="picker2" [(ngModel)]="dateTo"  autocomplete="off"  required  [disabled]="!withDate">
            <mat-datepicker-toggle matSuffix [for]="picker2"></mat-datepicker-toggle>
            <mat-datepicker #picker2></mat-datepicker>
        </mat-form-field>
      
        <ng-select  
            class="w-10"
            [items]="categorys" 
            [virtualScroll]="true" 
            appendTo="body" 
            bindLabel="Category"
            bindValue="Category"
            [searchable]="true" 
            [clearable] = "false" 
            placeholder="Category"
            [(ngModel)]="category"
            required>
        </ng-select>
        <mat-form-field class="w-10" floatLabel="never"  appearance="standard">
            <input matInput [(ngModel)]="value" type="text" mask="separator.2" thousandSeparator="," decimalMarker="." [dropSpecialCharacters]="true" [allowNegativeNumbers]="true" placeholder="Speed"  autocomplete="false">
        </mat-form-field>
        <ng-select  
            class="w-10"
            [items]="speedFilters" 
            [virtualScroll]="true" 
            appendTo="body" 
            [searchable]="true" 
            [clearable] = "false" 
            placeholder="SpeedFilter"
            [(ngModel)]="speedFilter"
            required>
        </ng-select>
        <ng-select 
          [items]="branches" 
          [virtualScroll]="true" 
          appendTo="body" 
          bindLabel="BranchName"
          bindValue="BranchId"
          [(ngModel)]="branchId" 
          [searchable]="true" 
          [clearable] = "false" 
          placeholder="Branch"
          class="w-10"
          >
      </ng-select>
        <button mat-raised-button color="primary" *ngFor="let tB of toolButtons" [disabled]="!tB.Disabled" (click)="tB.Function()" >{{tB.Label}}</button> 
    </div>
    <div class="mat-elevation-z2">
        <div class=" w-50" *ngIf="loaded" id="toprint"> 
            <div class="p text-center">
                <app-aprint-header></app-aprint-header>
            </div>
            <div class="title">
                    {{title}}
            </div>
            
            <div class="mb-5">
            <table class="w-100 table table-bordered">
                <thead class="thead-background">  
                <tr>
                    <th scope="col">ITEMNAME</th>
                    <th scope="col">UM</th>
                    <th scope="col">CATEGORY</th>
                    <th scope="col">QTYIN</th>
                    <th scope="col">QTYOUT</th>
                    <th scope="col">SPEED %</th>
                </tr>
                </thead>
                <tbody>
                <tr *ngFor="let data of movingItems">
                    <td >{{data.ItemName }}</td>
                    <td >{{data.UM }}</td>
                    <td >{{data.Category }}</td>
                    <td class="numeric">{{data.StockIn | number:'1.2-2'}}</td>
                    <td class="numeric">{{data.StockOut | number:'1.2-2'}}</td>
                    <td class="numeric">{{data.Speed | number:'1.2-2'}}</td>
                </tr>
                </tbody>  
            </table>
            </div>
            
        </div>
    </div>

</section>

<div style="visibility: hidden; position: fixed"
    [style.left]="contextMenuPosition.x"
    [style.top]="contextMenuPosition.y"
    [matMenuTriggerFor]="contextMenu">
</div>
<mat-menu #contextMenu="matMenu">
	<ng-template matMenuContent let-data="data">
        <button mat-menu-item *ngFor="let cB of contextButtons" [disabled]="!cB.Disabled" (click)="cB.Function()" >
            <mat-icon>read_more</mat-icon> {{cB.Label}}
        </button>
    </ng-template>
</mat-menu>

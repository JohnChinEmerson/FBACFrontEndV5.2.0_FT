<section class="content">
    <div class="search-div">
      <ng-select 
          [items]="terminals" 
          [virtualScroll]="true" 
          appendTo="body" 
          bindLabel="ComputerName"
          bindValue="ComputerName"
          [(ngModel)]="terminal" 
          [searchable]="true" 
          [clearable] = "false" 
          placeholder="Machine"
          class="w-10"
          >
      </ng-select>
        <mat-form-field appearance="standard">
            <mat-label>Date</mat-label>
            <input matInput [matDatepicker]="picker" [(ngModel)]="date"  autocomplete="off" required>
            <mat-datepicker-toggle matSuffix [for]="picker"></mat-datepicker-toggle>
            <mat-datepicker #picker></mat-datepicker>
        </mat-form-field>
        <button mat-raised-button color="primary" *ngFor="let tB of toolButtons" [disabled]="!tB.Disabled || (!loaded && tB.Label.toLowerCase() == 'generate')" (click)="tB.Function()" >{{tB.Label}}</button> 
       
    </div>
    <div class="mat-elevation-z2 ">
      <!-- desktop XZReading preview: the same lines as the POS print (DateZReadingsBAL.POSPrintXReading / POSPrintZReading) -->
      <div class="reading-preview" *ngIf="loaded" id="toprint">
          <app-receipt-lines [lines]="previewLines"></app-receipt-lines>
      </div>
    </div>
</section>

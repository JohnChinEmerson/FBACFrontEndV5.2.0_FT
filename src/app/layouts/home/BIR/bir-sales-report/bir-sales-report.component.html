<section class="content">
    <div class="search-div">
        <mat-form-field appearance="standard">
            <mat-label>DateFrom</mat-label>
            <input matInput [matDatepicker]="picker" [(ngModel)]="dateFrom" autocomplete="off" required>
            <mat-datepicker-toggle matSuffix [for]="picker"></mat-datepicker-toggle>
            <mat-datepicker #picker></mat-datepicker>
        </mat-form-field>
        <mat-form-field appearance="standard">
            <mat-label>DateTo</mat-label>
            <input matInput [matDatepicker]="picker2" [(ngModel)]="dateTo" autocomplete="off" required>
            <mat-datepicker-toggle matSuffix [for]="picker2"></mat-datepicker-toggle>
            <mat-datepicker #picker2></mat-datepicker>
        </mat-form-field>
        <button mat-raised-button color="primary" *ngFor="let tB of toolButtons" [disabled]="!tB.Disabled || isLoading" (click)="tB.Function()">{{tB.Label}}</button>
    </div>
    <mat-progress-bar mode="indeterminate" *ngIf="isLoading"></mat-progress-bar>
    <div class="mat-elevation-z2 report" *ngIf="data">
        <mat-tab-group [(selectedIndex)]="selectedIndex" animationDuration="0ms">
            <mat-tab *ngFor="let s of sections">
                <ng-template mat-tab-label>{{s.label}} ({{count(s.key)}})</ng-template>
                <ng-template matTabContent>
                    <div class="tab-body">
                        <app-bir-sales-report-tables [data]="data" [section]="s.key"></app-bir-sales-report-tables>
                    </div>
                </ng-template>
            </mat-tab>
        </mat-tab-group>
    </div>
</section>

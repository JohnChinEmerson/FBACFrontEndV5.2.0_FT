<app-background-logo-ui></app-background-logo-ui>

<div class="content">
    <mat-card>
        <button mat-icon-button class="close-button" (click)="onClose()" aria-label="Close dialog">
            <mat-icon class="close-icon" color="warn">close</mat-icon>
        </button>

        <h2 mat-dialog-title>SaleReturnConfigUI</h2>
        <mat-divider></mat-divider>

        <form [formGroup]="saleReturnConfigForm" (ngSubmit)="onSubmit()">

            <div mat-dialog-content>
                <div class="config-grid">

                    <!-- DisableTransDate + ReceiptLabel -->
                    <div class="field-row1">
                        <mat-checkbox
                            [checked]="saleReturnConfig.DisableTransDate == 'yes'"
                            (change)="onCheck('DisableTransDate', $event.checked, saleReturnConfig.DisableTransDate, 'Boolean')">
                            DisableTransDate
                        </mat-checkbox>

                        <mat-form-field appearance="outline" class="dense-field">
                            <input
                                matInput
                                placeholder="Input DisableTransDate"
                                autocomplete="off"
                                formControlName="DisableTransDate">
                        </mat-form-field>

                        
                    </div>

                    <!-- ReceiptNotes -->
                    <div class="field-row2">
                        <mat-checkbox
                            [checked]="saleReturnConfig.ReceiptNotes != null"
                            (change)="onCheck('ReceiptNotes', $event.checked, saleReturnConfig.ReceiptNotes, 'String')">
                            ReceiptNotes
                        </mat-checkbox>

                        <mat-form-field appearance="outline" class="dense-field receipt-notes-field">
                            <textarea
                                matInput
                                cols="30"
                                rows="2"
                                autocomplete="off"
                                placeholder="Input ReceiptNotes"
                                formControlName="ReceiptNotes"></textarea>
                        </mat-form-field>
                        <mat-checkbox
                            [checked]="saleReturnConfig.ReceiptLabel != null"
                            (change)="onCheck('ReceiptLabel', $event.checked, saleReturnConfig.ReceiptLabel, 'String')">
                            ReceiptLabel
                        </mat-checkbox>

                        <mat-form-field appearance="outline" class="dense-field">
                            <input
                                matInput
                                placeholder="Input ReceiptLabel"
                                autocomplete="off"
                                formControlName="ReceiptLabel">
                        </mat-form-field>
                    </div>

                    <!-- AutoVoucher + AutoDisburse -->
                    <div class="field-row2">
                        <mat-checkbox
                            [checked]="saleReturnConfig.AutoVoucher == 'yes'"
                            [disabled]="true"
                            (change)="onCheck('AutoVoucher', $event.checked, saleReturnConfig.AutoVoucher, 'Boolean')">
                            Auto Voucher
                        </mat-checkbox>

                        <mat-form-field appearance="outline" class="dense-field">
                            <input
                                matInput
                                placeholder="Input AutoVoucher"
                                autocomplete="off"
                                formControlName="AutoVoucher"
                                [disabled]="true">
                        </mat-form-field>

                        <mat-checkbox
                            [checked]="saleReturnConfig.AutoDisburse == 'yes'"
                            (change)="onCheck('AutoDisburse', $event.checked, saleReturnConfig.AutoDisburse, 'Boolean')">
                            Auto Disburse
                        </mat-checkbox>

                        <mat-form-field appearance="outline" class="dense-field">
                            <input
                                matInput
                                placeholder="Input AutoDisburse"
                                autocomplete="off"
                                formControlName="AutoDisburse">
                        </mat-form-field>
                    </div>

                    <!-- Cash accounts -->
                    <div class="field-row align-top">
                        <label>Cash Cash Account</label>
                        <mat-form-field appearance="outline" class="dense-field">
                            <mat-select formControlName="CashCashAccount">
                                <mat-option *ngFor="let v of cash" [value]="v.CashAccount">
                                    {{ v.CashAccount }}
                                </mat-option>
                            </mat-select>
                        </mat-form-field>
                    </div>

                    <div class="field-row align-top">
                        <label>Check Cash Account</label>
                        <mat-form-field appearance="outline" class="dense-field">
                            <mat-select formControlName="CheckCashAccount">
                                <mat-option *ngFor="let v of checks" [value]="v.CashAccount">
                                    {{ v.CashAccount }}
                                </mat-option>
                            </mat-select>
                        </mat-form-field>
                    </div>

                    <div class="field-row align-top">
                        <label>Bank Deposit Cash Account</label>
                        <mat-form-field appearance="outline" class="dense-field">
                            <mat-select formControlName="BankDepositCashAccount">
                                <mat-option *ngFor="let v of bankDeposits" [value]="v.CashAccount">
                                    {{ v.CashAccount }}
                                </mat-option>
                            </mat-select>
                        </mat-form-field>
                    </div>

                </div>
            </div>

            <div mat-dialog-actions align="end" class="mb-3">
                <button
                    type="submit"
                    class="mt-4 me-2"
                    mat-raised-button
                    color="primary"
                    [disabled]="saleReturnConfigForm.invalid || loading == true">
                    {{ btnText }}
                </button>
            </div>

        </form>
    </mat-card>
</div>

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Food and Beverage Web Accounting V5.2.0</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <link rel="icon" type="image/x-icon" href="/assets/CircleProductLogo.png">
  <link rel="preconnect" href="https://fonts.gstatic.com">
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
  <!-- phones only: splash screen while the app loads (AppComponent.hideSplash removes it) -->
  <style>
    #app-splash { display: none; }
    @media (max-width: 767.98px) {
      #app-splash {
        position: fixed; inset: 0; z-index: 2147483000;
        display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px;
        padding: env(safe-area-inset-top) 24px env(safe-area-inset-bottom);
        background: linear-gradient(160deg, #3F51B5, #283593);
        color: #fff; font-family: Roboto, "Helvetica Neue", sans-serif; text-align: center;
        transition: opacity .35s ease;
      }
      #app-splash.hide { opacity: 0; pointer-events: none; }
      #app-splash img {
        width: 108px; height: 108px; border-radius: 50%; background: #fff; padding: 6px;
        box-shadow: 0 8px 24px rgba(0, 0, 0, .25);
        animation: app-splash-pop .6s ease-out both, app-splash-pulse 1.6s ease-in-out .6s infinite;
      }
      #app-splash .app-splash-name { font-size: 22px; font-weight: 500; line-height: 1.25; animation: app-splash-up .6s ease-out .15s both; }
      #app-splash .app-splash-sub { font-size: 13px; opacity: .8; letter-spacing: .5px; animation: app-splash-up .6s ease-out .3s both; }
      #app-splash .app-splash-bar { width: 120px; height: 4px; border-radius: 2px; background: rgba(255, 255, 255, .25); overflow: hidden; margin-top: 8px; }
      #app-splash .app-splash-bar::after { content: ""; display: block; width: 40%; height: 100%; background: #fff; border-radius: 2px; animation: app-splash-load 1.1s ease-in-out infinite; }
    }
    @keyframes app-splash-pop { from { transform: scale(.6); opacity: 0; } to { transform: scale(1); opacity: 1; } }
    @keyframes app-splash-pulse { 50% { transform: scale(1.05); } }
    @keyframes app-splash-up { from { transform: translateY(12px); opacity: 0; } to { transform: none; opacity: 1; } }
    @keyframes app-splash-load { from { transform: translateX(-100%); } to { transform: translateX(250%); } }
    @media (prefers-reduced-motion: reduce) { #app-splash * { animation: none !important; } }
    /* never on paper (order slips, receipts, reports) */
    @media print { #app-splash { display: none !important; } }
  </style>
</head>
<body class="mat-typography">
  <div id="app-splash" role="status" aria-label="Loading">
    <img src="/assets/CircleProductLogo.png" alt="">
    <div class="app-splash-name">Food and Beverage<br>Web Accounting</div>
    <div class="app-splash-sub">V5.2.0 &middot; Mariosoft</div>
    <div class="app-splash-bar"></div>
  </div>
  <script>
    // Print popups (order slip, receipts, reports: PrintService.popupWindow opens a small named window) are not the
    // app starting on a phone: no splash there, the page prints as before. Anywhere else: shown at, removed by the
    // app once its first screen is ready (or after 8s whatever happens).
    (function () {
      var s = document.getElementById('app-splash');
      var path = location.pathname.slice(1), decoded = '';
      try { decoded = atob(path); } catch (e) { }
      if (window.opener || window.name || /^print\//i.test(path) || /^print\//i.test(decoded)) { if (s) s.remove(); return; }
      window.__splashStart = Date.now();
      setTimeout(function () { var x = document.getElementById('app-splash'); if (x) x.remove(); }, 8000);
    })();
  </script>
  <app-root></app-root>
</body>
</html>
